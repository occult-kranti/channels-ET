<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 262" role="img" aria-label="Higher mind and physical mind" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:11.5px;font-weight:700" ><tspan x="200.0" dy="0.0">HIGHER MIND &amp; PHYSICAL MIND — the division of labour</tspan></text><rect x="60.0" y="32.0" width="280.0" height="70.0" rx="8" class="dg-line dg-fill-2" /><text x="200.0" y="52.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">HIGHER MIND</tspan></text><text x="200.0" y="74.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="-5.7">conceives · sees the whole path · chooses timing ·</tspan><tspan x="200.0" dy="11.4">&quot;the pilot&quot;</tspan></text><rect x="60.0" y="122.0" width="280.0" height="26.0" rx="6" class="dg-line-2 dg-fill" /><text x="200.0" y="139.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="0.0">template level  ·  the heart / resonance</tspan></text><rect x="60.0" y="168.0" width="280.0" height="70.0" rx="8" class="dg-line dg-fill" /><text x="200.0" y="188.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">PHYSICAL MIND</tspan></text><text x="200.0" y="210.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="-5.7">perceives · acts on what is in front of it · &quot;the</tspan><tspan x="200.0" dy="11.4">passenger / navigator&quot;</tspan></text><line x1="30.0" y1="104.0" x2="30.0" y2="166.0" class="dg-line" marker-end="url(#dg-arrow)"/><text x="24.0" y="138.0" class="dg-muted" text-anchor="middle" style="font-size:8px" transform="rotate(-90 24 138)"><tspan x="24.0" dy="0.0">excitement &amp; synchronicity</tspan></text><line x1="372.0" y1="166.0" x2="372.0" y2="104.0" class="dg-line" marker-end="url(#dg-arrow)"/><text x="380.0" y="138.0" class="dg-muted" text-anchor="middle" style="font-size:8px" transform="rotate(90 380 138)"><tspan x="380.0" dy="0.0">trust &amp; action</tspan></text><text x="200.0" y="254.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">The physical mind &quot;was never designed to know how&quot; — that is the higher mind&#x27;s</tspan><tspan x="200.0" dy="11.4">job (recurring teaching).</tspan></text></svg>