 class="dg-line-2" /><text x="392.0" y="183.0" class="dg-muted" text-anchor="start" style="font-size:8.5px" ><tspan x="392.0" dy="0.0">d</tspan></text><circle cx="127.0" cy="180.0" r="3.0" class="dg-accent-fill" /><circle cx="237.0" cy="180.0" r="3.0" class="dg-accent-fill" /><circle cx="347.0" cy="180.0" r="3.0" class="dg-accent-fill" /><path d="M200,60 C200,200 40,200 40,210" class="dg-line-2" /><line x1="40.0" y1="210.0" x2="380.0" y2="210.0" class="dg-line-2" /><text x="392.0" y="213.0" class="dg-muted" text-anchor="start" style="font-size:8.5px" ><tspan x="392.0" dy="0.0">e</tspan></text><circle cx="136.0" cy="210.0" r="3.0" class="dg-accent-fill" /><circle cx="246.0" cy="210.0" r="3.0" class="dg-accent-fill" /><circle cx="356.0" cy="210.0" r="3.0" class="dg-accent-fill" /><path d="M209,150 L209,120" class="dg-accent" marker-end="url(#dg-arrow)"/><path d="M328,150 L328,180" class="dg-accent" marker-end="url(#dg-arrow)"/><text x="200.0" y="245.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="-5.1">simultaneous lives run in parallel and can exchange information; &quot;Willa&#x27;s PIN</tspan><tspan x="200.0" dy="10.2">chart&quot; maps such parallel incarnations</tspan></text><text x="200.0" y="278.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">The handout&#x27;s own chart is unreadable; this only illustrates the idea</tspan><tspan x="200.0" dy="11.4">Willa/Bashar describe.</tspan></text></svg>