<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="The Black Box: two lists" class="dg"><text x="200.0" y="18.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">THE BLACK BOX</tspan></text><rect x="150.0" y="40.0" width="100.0" height="70.0" rx="8" class="dg-ink-fill" /><text x="200.0" y="70.0" class="dg-inv" text-anchor="middle" style="font-size:10px" ><tspan x="200.0" dy="0.0">negative belief</tspan></text><text x="200.0" y="84.0" class="dg-inv" text-anchor="middle" style="font-size:9px" ><tspan x="200.0" dy="0.0">(a &quot;black box&quot;)</tspan></text><text x="200.0" y="128.0" class="dg-muted" text-anchor="middle" style="font-size:9px" ><tspan x="200.0" dy="-5.4">suspension of disbelief: treat the belief as a</tspan><tspan x="200.0" dy="10.8">quasi-intelligent structure with defences</tspan></text><rect x="8.0" y="150.0" width="186.0" height="128.0" rx="6" class="dg-line dg-fill" /><text x="101.0" y="166.0" class="dg-text" text-anchor="middle" style="font-size:10.5px;font-weight:600" ><tspan x="101.0" dy="0.0">27 tools &amp; tricks it uses</tspan></text><text x="101.0" y="184.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="101.0" dy="0.0">claims to be the only view</tspan></text><text x="101.0" y="203.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="101.0" dy="0.0">threatens pain if released</tspan></text><text x="101.0" y="222.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="101.0" dy="0.0">poses as your protector</tspan></text><text x="101.0" y="241.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="101.0" dy="0.0">denies it even exists</tspan></text><text x="101.0" y="260.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="101.0" dy="0.0">… (23 more)</tspan></text><rect x="206.0" y="150.0" width="186.0" height="128.0" rx="6" class="dg-line dg-fill-2" /><text x="299.0" y="166.0" class="dg-text" text-anchor="middle" style="font-size:10.5px;font-weight:600" ><tspan x="299.0" dy="0.0">24 negativity neutralizers</tspan></text><text x="299.0" y="184.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="299.0" dy="0.0">negative emotion ⇒ a belief</tspan></text><text x="299.0" y="203.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="299.0" dy="0.0">beliefs are assumptions</tspan></text><text x="299.0" y="222.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="299.0" dy="0.0">circumstances carry no meaning</tspan></text><text x="299.0" y="241.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="299.0" dy="0.0">fear peaking = belief dissolving</tspan></text><text x="299.0" y="260.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="299.0" dy="0.0">… (20 more)</tspan></text><line x1="150.0" y1="75.0" x2="101.0" y2="148.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><line x1="250.0" y1="75.0" x2="299.0" y2="148.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/></svg>