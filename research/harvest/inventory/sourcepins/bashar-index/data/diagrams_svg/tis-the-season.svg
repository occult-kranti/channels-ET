<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Season placeholder" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">&#x27;TIS THE SEASON</tspan></text><circle cx="200.0" cy="110.0" r="34.0" class="dg-line dg-fill-2" /><line x1="244.0" y1="110.0" x2="258.0" y2="110.0" class="dg-line-2" /><line x1="238.1" y1="132.0" x2="250.2" y2="139.0" class="dg-line-2" /><line x1="222.0" y1="148.1" x2="229.0" y2="160.2" class="dg-line-2" /><line x1="200.0" y1="154.0" x2="200.0" y2="168.0" class="dg-line-2" /><line x1="178.0" y1="148.1" x2="171.0" y2="160.2" class="dg-line-2" /><line x1="161.9" y1="132.0" x2="149.8" y2="139.0" class="dg-line-2" /><line x1="156.0" y1="110.0" x2="142.0" y2="110.0" class="dg-line-2" /><line x1="161.9" y1="88.0" x2="149.8" y2="81.0" class="dg-line-2" /><line x1="178.0" y1="71.9" x2="171.0" y2="59.8" class="dg-line-2" /><line x1="200.0" y1="66.0" x2="200.0" y2="52.0" class="dg-line-2" /><line x1="222.0" y1="71.9" x2="229.0" y2="59.8" class="dg-line-2" /><line x1="238.1" y1="88.0" x2="250.2" y2="81.0" class="dg-line-2" /><text x="200.0" y="186.0" class="dg-muted" text-anchor="middle" style="font-size:9px" ><tspan x="200.0" dy="-5.4">a holiday-season handout listed on bashar.org; no</tspan><tspan x="200.0" dy="10.8">description of its contents could be found</tspan></text><text x="200.0" y="220.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="-5.1">Bashar&#x27;s December sessions usually reinterpret solstice light and gift-giving as</tspan><tspan x="200.0" dy="10.2">permission slips for generosity and self-worth</tspan></text></svg>