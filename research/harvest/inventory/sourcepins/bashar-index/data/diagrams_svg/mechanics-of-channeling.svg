<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 262" role="img" aria-label="Channeling circuit" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:700" ><tspan x="200.0" dy="0.0">THE MECHANICS OF CHANNELING — as a circuit (concept)</tspan></text><rect x="20.0" y="60.0" width="80.0" height="50.0" rx="6" class="dg-line dg-fill" /><text x="60.0" y="88.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="60.0" dy="-10.2">non-physical</tspan><tspan x="60.0" dy="10.2">consciousness</tspan><tspan x="60.0" dy="10.2">(source)</tspan></text><rect x="110.0" y="60.0" width="80.0" height="50.0" rx="6" class="dg-line dg-fill" /><text x="150.0" y="88.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="150.0" dy="0.0">template level</tspan></text><rect x="200.0" y="60.0" width="80.0" height="50.0" rx="6" class="dg-line dg-fill" /><text x="240.0" y="88.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="240.0" dy="-5.1">brain: receiver</tspan><tspan x="240.0" dy="10.2">&amp; translator</tspan></text><rect x="290.0" y="60.0" width="80.0" height="50.0" rx="6" class="dg-line dg-fill" /><text x="330.0" y="88.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="330.0" dy="0.0">speech / output</tspan></text><line x1="100.0" y1="85.0" x2="110.0" y2="85.0" class="dg-line" /><line x1="190.0" y1="85.0" x2="200.0" y2="85.0" class="dg-line" /><line x1="280.0" y1="85.0" x2="290.0" y2="85.0" class="dg-line" /><path d="M180,85 l4,-6 l6,12 l6,-12 l6,12 l6,-12 l4,6" class="dg-accent" /><text x="205.0" y="128.0" class="dg-muted" text-anchor="middle" style="font-size:8px" ><tspan x="205.0" dy="0.0">belief filter (resistance)</tspan></text><rect x="200.0" y="160.0" width="80.0" height="40.0" rx="6" class="dg-line dg-fill-2" /><text x="240.0" y="183.2" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="240.0" dy="-5.4">heart:</tspan><tspan x="240.0" dy="10.8">resonance</tspan></text><line x1="240.0" y1="110.0" x2="240.0" y2="160.0" class="dg-line-2" /><line x1="240.0" y1="200.0" x2="240.0" y2="224.0" class="dg-line-2" /><text x="240.0" y="236.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="240.0" dy="0.0">gamma brain-state · relaxed definitions = clean signal</tspan></text><text x="200.0" y="254.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">Only the &quot;circuit diagram&quot; metaphor is confirmed for the 2015 handout; component</tspan><tspan x="200.0" dy="11.4">labels are inferred from Bashar&#x27;s general account.</tspan></text></svg>