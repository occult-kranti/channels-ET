<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="Keys of Ascension chart" class="dg"><text x="200.0" y="15.0" class="dg-text" text-anchor="middle" style="font-size:11.5px;font-weight:700" ><tspan x="200.0" dy="0.0">THE KEYS OF ASCENSION — meditation chart</tspan></text><text x="200.0" y="29.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="0.0">formlessness → point → line → plane → the nine levels → collapse back</tspan></text><rect x="10.0" y="40.0" width="380.0" height="22.0" rx="3" class="dg-line-2 dg-fill-2" /><circle cx="30.0" cy="51.0" r="8.0" class="dg-line" /><path d="M22.0,51 A8.0,2.6666666666666665 0 0 0 38.0,51" class="dg-line-2" /><text x="60.0" y="55.0" class="dg-text" text-anchor="start" style="font-size:10px;font-weight:600" ><tspan x="60.0" dy="0.0">9  All-That-Is</tspan></text><text x="178.0" y="55.0" class="dg-text" text-anchor="start" style="font-size:9.5px" ><tspan x="178.0" dy="0.0">sphere</tspan></text><text x="385.0" y="55.0" class="dg-muted" text-anchor="end" style="font-size:9px" ><tspan x="385.0" dy="0.0">silvery, clear light</tspan></text><rect x="10.0" y="65.0" width="380.0" height="22.0" rx="3" class="dg-line-2 dg-fill-2" /><ellipse cx="30" cy="76" rx="8.0" ry="2.6666666666666665" class="dg-line"/><ellipse cx="30" cy="76" rx="2.6666666666666665" ry="0.8888888888888888" class="dg-line-2"/><text x="60.0" y="80.0" class="dg-text" text-anchor="start" style="font-size:10px;font-weight:600" ><tspan x="60.0" dy="0.0">8  Galactic</tspan></text><text x="178.0" y="80.0" class="dg-text" text-anchor="start" style="font-size:9.5px" ><tspan x="178.0" dy="0.0">disc / torus / halo</tspan></text><text x="385.0" y="80.0" class="dg-muted" text-anchor="end" style="font-size:9px" ><tspan x="385.0" dy="0.0">white light</tspan></text><rect x="10.0" y="90.0" width="380.0" height="22.0" rx="3" class="dg-line-2 " /><text x="30.0" y="105.0" class="dg-muted" text-anchor="middle" style="font-size:12px" ><tspan x="30.0" dy="0.0">?</tspan></text><text x="60.0" y="105.0" class="dg-text" text-anchor="start" style="font-size:10px;font-weight:600" ><tspan x="60.0" dy="0.0">7  Crown</tspan></text><text x="178.0" y="105.0" class="dg-text" text-anchor="start" style="font-size:9.5px" ><tspan x="178.0" dy="0.0">(shape unknown)</tspan></text><text x="385.0" y="105.0" class="dg-muted" text-anchor="end" style="font-size:9px" ><tspan x="385.0" dy="0.0">violet, white-hot centre</tspan></text><rect x="10.0" y="115.0" width="380.0" height="22.0" rx="3" class="dg-line-2 " /><rect x="22.0" y="118.0" width="16.0" height="16.0" rx="0" class="dg-line" /><rect x="26.0" y="122.0" width="8.0" height="8.0" rx="0" class="dg-line" /><line x1="22.0" y1="118.0" x2="26.0" y2="122.0" class="dg-line-2" /><line x1="22.0" y1="134.0" x2="26.0" y2="130.0" class="dg-line-2" /><line x1="38.0" y1="118.0" x2="34.0" y2="122.0" class="dg-line-2" /><line x1="38.0" y1="134.0" x2="34.0" y2="130.0" class="dg-line-2" /><text x="60.0" y="130.0" class="dg-text" text-anchor="start" style="font-size:10px;font-weight:600" ><tspan x="60.0" dy="0.0">6  Third eye</tspan></text><text x="178.0" y="130.0" class="dg-text" text-anchor="start" style="font-size:9.5px" ><tspan x="178.0" dy="0.0">tesseract</tspan></text><text x="385.0" y="130.0" class="dg-muted" text-anchor="end" style="font-size:9px" ><tspan x="385.0" dy="0.0">indigo</tspan></text><rect x="10.0" y="140.0" width="380.0" height="22.0" rx="3" class="dg-line-2 " /><polygon points="30.0,143.0 38.0,151.0 30.0,159.0 22.0,151.0" class="dg-line" /><line x1="22.0" y1="151.0" x2="38.0" y2="151.0" class="dg-line-2" /><text x="60.0" y="155.0" class="dg-text" text-anchor="start" style="font-size:10px;font-weight:600" ><tspan x="60.0" dy="0.0">5  Throat</tspan></text><text x="178.0" y="155.0" class="dg-text" text-anchor="start" style="font-size:9.5px" ><tspan x="178.0" dy="0.0">octahedron</tspan></text><text x="385.0" y="155.0" class="dg-muted" text-anchor="end" styl