0" dy="0.0">golden orange</tspan></text><rect x="10.0" y="240.0" width="380.0" height="22.0" rx="3" class="dg-line-2 " /><rect x="22.0" y="247.0" width="12.0" height="12.0" rx="0" class="dg-line" /><polygon points="22.0,247.0 26.0,243.0 38.0,243.0 34.0,247.0" class="dg-line" /><polygon points="34.0,247.0 38.0,243.0 38.0,255.0 34.0,259.0" class="dg-line" /><text x="60.0" y="255.0" class="dg-text" text-anchor="start" style="font-size:10px;font-weight:600" ><tspan x="60.0" dy="0.0">1  Root</tspan></text><text x="178.0" y="255.0" class="dg-text" text-anchor="start" style="font-size:9.5px" ><tspan x="178.0" dy="0.0">cube</tspan></text><text x="385.0" y="255.0" class="dg-muted" text-anchor="end" style="font-size:9px" ><tspan x="385.0" dy="0.0">deep red</tspan></text><text x="200.0" y="282.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">Text from the 1992 handout; the solid-to-level pairing is the best-supported</tspan><tspan x="200.0" dy="11.4">reading (one alternative shifts every solid one level up).</tspan></text></svg>