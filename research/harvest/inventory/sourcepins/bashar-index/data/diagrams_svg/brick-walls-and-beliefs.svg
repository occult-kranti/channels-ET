<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" role="img" aria-label="Brick wall of beliefs" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">BRICK WALLS &amp; BELIEFS (concept)</tspan></text><rect x="20.0" y="36.0" width="86.0" height="34.0" rx="2" class="dg-line dg-fill" /><text x="63.0" y="57.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="63.0" dy="-5.1">&quot;that&#x27;s just how</tspan><tspan x="63.0" dy="10.2">it is&quot;</tspan></text><rect x="110.0" y="36.0" width="86.0" height="34.0" rx="2" class="dg-line dg-fill" /><text x="153.0" y="57.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="153.0" dy="0.0">not enough</tspan></text><rect x="200.0" y="36.0" width="86.0" height="34.0" rx="2" class="dg-line dg-fill" /><text x="243.0" y="57.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="243.0" dy="0.0">unsafe</tspan></text><rect x="290.0" y="36.0" width="86.0" height="34.0" rx="2" class="dg-line dg-fill" /><text x="333.0" y="57.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="333.0" dy="0.0">not worthy</tspan></text><rect x="65.0" y="76.0" width="86.0" height="34.0" rx="2" class="dg-line dg-fill" /><text x="108.0" y="97.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="108.0" dy="-5.1">letting go will</tspan><tspan x="108.0" dy="10.2">hurt</tspan></text><rect x="155.0" y="76.0" width="86.0" height="34.0" rx="2" class="dg-line dg-fill-2" /><text x="198.0" y="97.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="198.0" dy="0.0">it protects me</tspan></text><rect x="245.0" y="76.0" width="86.0" height="34.0" rx="2" class="dg-line dg-fill" /><text x="288.0" y="97.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="288.0" dy="-5.1">change is</tspan><tspan x="288.0" dy="10.2">impossible</tspan></text><rect x="20.0" y="116.0" width="86.0" height="34.0" rx="2" class="dg-line dg-fill" /><text x="63.0" y="137.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="63.0" dy="0.0">nobody would</tspan></text><rect x="110.0" y="116.0" width="86.0" height="34.0" rx="2" class="dg-line dg-fill" /><text x="153.0" y="137.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="153.0" dy="0.0">too late</tspan></text><rect x="200.0" y="116.0" width="86.0" height="34.0" rx="2" class="dg-line dg-fill" /><text x="243.0" y="137.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="243.0" dy="0.0">I can&#x27;t</tspan></text><rect x="290.0" y="116.0" width="86.0" height="34.0" rx="2" class="dg-line dg-fill" /><text x="333.0" y="137.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="333.0" dy="0.0">unlovable</tspan></text><path d="M198,150 L198,170" class="dg-accent" marker-end="url(#dg-arrow)"/><text x="200.0" y="186.0" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:600" ><tspan x="200.0" dy="0.0">the brick with the emotional charge is the clue</tspan></text><text x="200.0" y="212.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="200.0" dy="-5.4">each brick is a definition holding the wall up; find the one behind the</tspan><tspan x="200.0" dy="10.8">repeating block, examine what releasing it would mean, replace it</tspan></text><text x="200.0" y="244.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">Bashar&#x27;s metaphor from the 2009 workshop; the handout&#x27;s own drawing is</tspan><tspan x="200.0" dy="11.4">unverified.</tspan></text></svg>