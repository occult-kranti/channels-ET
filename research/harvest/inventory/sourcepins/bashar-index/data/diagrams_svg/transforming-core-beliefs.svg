<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 258" role="img" aria-label="Belief worksheet" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:700" ><tspan x="200.0" dy="0.0">TRANSFORMING CORE BELIEFS — the writing tool (concept)</tspan></text><rect x="8.0" y="32.0" width="72.0" height="200.0" rx="4" class="dg-line-2 dg-fill" /><text x="44.0" y="56.0" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="44.0" dy="-4.5">the limiting</tspan><tspan x="44.0" dy="9.0">belief</tspan></text><line x1="16.0" y1="100.0" x2="72.0" y2="100.0" class="dg-line-2" /><line x1="16.0" y1="126.0" x2="72.0" y2="126.0" class="dg-line-2" /><line x1="16.0" y1="152.0" x2="72.0" y2="152.0" class="dg-line-2" /><line x1="16.0" y1="178.0" x2="72.0" y2="178.0" class="dg-line-2" /><line x1="16.0" y1="204.0" x2="72.0" y2="204.0" class="dg-line-2" /><rect x="86.0" y="32.0" width="72.0" height="200.0" rx="4" class="dg-line-2 " /><text x="122.0" y="56.0" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="122.0" dy="-13.5">what would I</tspan><tspan x="122.0" dy="9.0">have to believe</tspan><tspan x="122.0" dy="9.0">for this to</tspan><tspan x="122.0" dy="9.0">feel true?</tspan></text><line x1="94.0" y1="100.0" x2="150.0" y2="100.0" class="dg-line-2" /><line x1="94.0" y1="126.0" x2="150.0" y2="126.0" class="dg-line-2" /><line x1="94.0" y1="152.0" x2="150.0" y2="152.0" class="dg-line-2" /><line x1="94.0" y1="178.0" x2="150.0" y2="178.0" class="dg-line-2" /><line x1="94.0" y1="204.0" x2="150.0" y2="204.0" class="dg-line-2" /><rect x="164.0" y="32.0" width="72.0" height="200.0" rx="4" class="dg-line-2 dg-fill" /><text x="200.0" y="56.0" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="200.0" dy="-9.0">what fear stops</tspan><tspan x="200.0" dy="9.0">me releasing</tspan><tspan x="200.0" dy="9.0">it?</tspan></text><line x1="172.0" y1="100.0" x2="228.0" y2="100.0" class="dg-line-2" /><line x1="172.0" y1="126.0" x2="228.0" y2="126.0" class="dg-line-2" /><line x1="172.0" y1="152.0" x2="228.0" y2="152.0" class="dg-line-2" /><line x1="172.0" y1="178.0" x2="228.0" y2="178.0" class="dg-line-2" /><line x1="172.0" y1="204.0" x2="228.0" y2="204.0" class="dg-line-2" /><rect x="242.0" y="32.0" width="72.0" height="200.0" rx="4" class="dg-line-2 " /><text x="278.0" y="56.0" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="278.0" dy="-9.0">how does</tspan><tspan x="278.0" dy="9.0">holding it</tspan><tspan x="278.0" dy="9.0">serve me?</tspan></text><line x1="250.0" y1="100.0" x2="306.0" y2="100.0" class="dg-line-2" /><line x1="250.0" y1="126.0" x2="306.0" y2="126.0" class="dg-line-2" /><line x1="250.0" y1="152.0" x2="306.0" y2="152.0" class="dg-line-2" /><line x1="250.0" y1="178.0" x2="306.0" y2="178.0" class="dg-line-2" /><line x1="250.0" y1="204.0" x2="306.0" y2="204.0" class="dg-line-2" /><rect x="320.0" y="32.0" width="72.0" height="200.0" rx="4" class="dg-line-2 dg-fill" /><text x="356.0" y="56.0" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="356.0" dy="-4.5">the preferred</tspan><tspan x="356.0" dy="9.0">definition</tspan></text><line x1="328.0" y1="100.0" x2="384.0" y2="100.0" class="dg-line-2" /><line x1="328.0" y1="126.0" x2="384.0" y2="126.0" class="dg-line-2" /><line x1="328.0" y1="152.0" x2="384.0" y2="152.0" class="dg-line-2" /><line x1="328.0" y1="178.0" x2="384.0" y2="178.0" class="dg-line-2" /><line x1="328.0" y1="204.0" x2="384.0" y2="204.0" class="dg-line-2" /><text x="200.0" y="250.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">Bashar&#x27;s diagnostic questions are documented; the 2006 handout&#x27;s own layout is</tspan><tspan x="200.0" dy="11.4">inferred.</tspan></text></svg>