<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" role="img" aria-label="Dream contact pass phrase" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">TELL THEM BASHAR SENT YOU (concept)</tspan></text><rect x="12.0" y="60.0" width="70.0" height="60.0" rx="6" class="dg-line dg-fill" /><text x="47.0" y="93.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="47.0" dy="-5.1">sleep /</tspan><tspan x="47.0" dy="10.2">altered state</tspan></text><line x1="83.0" y1="90.0" x2="89.0" y2="90.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="90.0" y="60.0" width="70.0" height="60.0" rx="6" class="dg-line dg-fill" /><text x="125.0" y="93.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="125.0" dy="-10.2">lucid</tspan><tspan x="125.0" dy="10.2">awareness in</tspan><tspan x="125.0" dy="10.2">the dream</tspan></text><line x1="161.0" y1="90.0" x2="167.0" y2="90.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="168.0" y="60.0" width="70.0" height="60.0" rx="6" class="dg-line dg-fill" /><text x="203.0" y="93.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="203.0" dy="-10.2">encounter</tspan><tspan x="203.0" dy="10.2">(Yahyel &amp;</tspan><tspan x="203.0" dy="10.2">others)</tspan></text><line x1="239.0" y1="90.0" x2="245.0" y2="90.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="246.0" y="60.0" width="70.0" height="60.0" rx="6" class="dg-line dg-fill-2" /><text x="281.0" y="93.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="281.0" dy="-15.3">the</tspan><tspan x="281.0" dy="10.2">pass-phrase:</tspan><tspan x="281.0" dy="10.2">&quot;Bashar sent</tspan><tspan x="281.0" dy="10.2">me&quot;</tspan></text><line x1="317.0" y1="90.0" x2="323.0" y2="90.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="324.0" y="60.0" width="70.0" height="60.0" rx="6" class="dg-line dg-fill" /><text x="359.0" y="93.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="359.0" dy="-10.2">recall &amp;</tspan><tspan x="359.0" dy="10.2">integrate on</tspan><tspan x="359.0" dy="10.2">waking</tspan></text><text x="200.0" y="150.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="200.0" dy="-5.4">a permission slip signalling readiness and friendly intent — step 2 of</tspan><tspan x="200.0" dy="10.8">the Guide to Open Contact (2021)</tspan></text></svg>