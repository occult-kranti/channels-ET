<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="UFO Witness Declaration structure" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">UFO WITNESS DECLARATION (2012)</tspan></text><rect x="40.0" y="28.0" width="320.0" height="240.0" rx="6" class="dg-line" /><rect x="52.0" y="46.0" width="296.0" height="26.0" rx="4" class="dg-line-2 dg-fill" /><text x="70.0" y="62.0" class="dg-text" text-anchor="start" style="font-size:10px;font-weight:700" ><tspan x="70.0" dy="0.0">FACT</tspan></text><text x="108.0" y="62.0" class="dg-text" text-anchor="start" style="font-size:9.5px" ><tspan x="108.0" dy="0.0">Hudson Valley, 1982–85: thousands of witnesses</tspan></text><rect x="52.0" y="80.0" width="296.0" height="26.0" rx="4" class="dg-line-2 dg-fill" /><text x="70.0" y="96.0" class="dg-text" text-anchor="start" style="font-size:10px;font-weight:700" ><tspan x="70.0" dy="0.0">FACT</tspan></text><text x="108.0" y="96.0" class="dg-text" text-anchor="start" style="font-size:9.5px" ><tspan x="108.0" dy="0.0">Belgium, 1989–90: tracked by radar &amp; fighter jets</tspan></text><rect x="52.0" y="114.0" width="296.0" height="26.0" rx="4" class="dg-line-2 dg-fill" /><text x="70.0" y="130.0" class="dg-text" text-anchor="start" style="font-size:10px;font-weight:700" ><tspan x="70.0" dy="0.0">FACT</tspan></text><text x="108.0" y="130.0" class="dg-text" text-anchor="start" style="font-size:9.5px" ><tspan x="108.0" dy="0.0">Arizona, 1997: the &quot;Phoenix lights&quot;</tspan></text><text x="200.0" y="168.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="-5.7">&quot;more than 50% of Americans believe…&quot; · &quot;over 36 million</tspan><tspan x="200.0" dy="11.4">Americans have seen a UFO&quot;</tspan></text><text x="200.0" y="205.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="-5.7">in political terms: a bloc larger than most voting</tspan><tspan x="200.0" dy="11.4">blocs</tspan></text><rect x="120.0" y="228.0" width="160.0" height="28.0" rx="6" class="dg-ink-fill" /><text x="200.0" y="246.0" class="dg-inv" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="0.0">call to action: declare openly</tspan></text></svg>