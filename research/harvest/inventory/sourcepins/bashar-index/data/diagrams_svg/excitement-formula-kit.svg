<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Formula and kit" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">THE FORMULA + &quot;THE COMPLETE KIT&quot;</tspan></text><rect x="8.0" y="32.0" width="90.0" height="44.0" rx="6" class="dg-line dg-fill-2" /><text x="53.0" y="57.3" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="53.0" dy="-5.7">act on highest</tspan><tspan x="53.0" dy="11.4">excitement</tspan></text><rect x="105.0" y="32.0" width="90.0" height="44.0" rx="6" class="dg-line dg-fill-2" /><text x="150.0" y="57.3" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="150.0" dy="-5.7">to the best of</tspan><tspan x="150.0" dy="11.4">your ability</tspan></text><rect x="202.0" y="32.0" width="90.0" height="44.0" rx="6" class="dg-line dg-fill-2" /><text x="247.0" y="57.3" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="247.0" dy="-5.7">zero insistence</tspan><tspan x="247.0" dy="11.4">on outcome</tspan></text><rect x="299.0" y="32.0" width="90.0" height="44.0" rx="6" class="dg-line dg-fill-2" /><text x="344.0" y="57.3" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="344.0" dy="0.0">stay positive</tspan></text><line x1="200.0" y1="80.0" x2="200.0" y2="104.0" class="dg-line" marker-end="url(#dg-arrow)"/><text x="214.0" y="96.0" class="dg-muted" text-anchor="start" style="font-size:8.5px" ><tspan x="214.0" dy="0.0">excitement then contains</tspan></text><rect x="8.0" y="110.0" width="90.0" height="50.0" rx="6" class="dg-line dg-fill" /><text x="53.0" y="138.2" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="53.0" dy="-5.4">the driving</tspan><tspan x="53.0" dy="10.8">engine</tspan></text><rect x="105.0" y="110.0" width="90.0" height="50.0" rx="6" class="dg-line dg-fill" /><text x="150.0" y="138.2" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="150.0" dy="-10.8">organizing</tspan><tspan x="150.0" dy="10.8">principle</tspan><tspan x="150.0" dy="10.8">(synchronicity)</tspan></text><rect x="202.0" y="110.0" width="90.0" height="50.0" rx="6" class="dg-line dg-fill" /><text x="247.0" y="138.2" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="247.0" dy="-5.4">path of least</tspan><tspan x="247.0" dy="10.8">resistance</tspan></text><rect x="299.0" y="110.0" width="90.0" height="50.0" rx="6" class="dg-line dg-fill" /><text x="344.0" y="138.2" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="344.0" dy="-5.4">path of</tspan><tspan x="344.0" dy="10.8">connection</tspan></text><rect x="8.0" y="170.0" width="90.0" height="50.0" rx="6" class="dg-line dg-fill" /><text x="53.0" y="198.2" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="53.0" dy="0.0">path of support</tspan></text><rect x="105.0" y="170.0" width="90.0" height="50.0" rx="6" class="dg-line dg-fill" /><text x="150.0" y="198.2" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="150.0" dy="0.0">reflective mirror</tspan></text><rect x="202.0" y="170.0" width="90.0" height="50.0" rx="6" class="dg-line dg-fill" /><text x="247.0" y="198.2" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="247.0" dy="-5.4">all the tools you</tspan><tspan x="247.0" dy="10.8">need</tspan></text><text x="345.0" y="180.0" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:600" ><tspan x="345.0" dy="0.0">= 11 elements</tspan></text><text x="345.0" y="196.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="345.0" dy="0.0">(the &quot;1-3-5-7-11&quot;)</tspan></text><text x="200.0" y="232.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="0.0">Kit property names vary slightly by session.</tspan></text></svg>