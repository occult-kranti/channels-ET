<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="Eye of the Needle hourglass" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:11.5px;font-weight:700" ><tspan x="200.0" dy="0.0">THE EYE OF THE NEEDLE — 2020 as a pivotal point</tspan></text><path d="M10,50 C120,50 150,150 200,150" class="dg-line-2" /><path d="M10,70 C120,70 150,150 200,150" class="dg-line-2" /><path d="M10,90 C120,90 150,150 200,150" class="dg-line-2" /><path d="M10,110 C120,110 150,150 200,150" class="dg-line-2" /><path d="M10,130 C120,130 150,150 200,150" class="dg-line-2" /><path d="M10,150 C120,150 150,150 200,150" class="dg-line-2" /><path d="M10,170 C120,170 150,150 200,150" class="dg-line-2" /><path d="M10,190 C120,190 150,150 200,150" class="dg-line-2" /><path d="M10,210 C120,210 150,150 200,150" class="dg-line-2" /><path d="M200,150 C250,150 280,70 390,70" class="dg-accent" /><text x="388.0" y="64.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="388.0" dy="0.0">positive Earth</tspan></text><path d="M200,150 C250,150 280,110 390,110" class="dg-line-2" /><path d="M200,150 C250,150 280,150 390,150" class="dg-line-2" /><path d="M200,150 C250,150 280,190 390,190" class="dg-line-2" /><path d="M200,150 C250,150 280,230 390,230" class="dg-line" /><text x="388.0" y="224.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="388.0" dy="0.0">negative Earth</tspan></text><circle cx="200.0" cy="150.0" r="9.0" class="dg-line dg-fill" /><text x="200.0" y="176.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:700" ><tspan x="200.0" dy="0.0">2020</tspan></text><text x="200.0" y="190.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="0.0">the aperture</tspan></text><text x="60.0" y="250.0" class="dg-muted" text-anchor="start" style="font-size:8.5px" ><tspan x="60.0" dy="0.0">many overlapping timelines converge…</tspan></text><text x="390.0" y="250.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="390.0" dy="0.0">…then diverge into distinct worlds</tspan></text><text x="200.0" y="282.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">Bashar&#x27;s metaphor (April 2020); the five permission-slip steps of that session</tspan><tspan x="200.0" dy="11.4">were not recovered, so none are shown.</tspan></text></svg>