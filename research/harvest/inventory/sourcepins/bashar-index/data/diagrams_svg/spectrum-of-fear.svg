<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 275" role="img" aria-label="Spectrum of Fear staircase" class="dg"><text x="200.0" y="15.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:700" ><tspan x="200.0" dy="0.0">THE SPECTRUM OF FEAR — each level contains all the levels below it</tspan></text><rect x="10.0" y="244.0" width="60.0" height="20.0" rx="3" class="dg-line-2 dg-fill" opacity="0.35"/><text x="14.0" y="258.0" class="dg-text" text-anchor="start" style="font-size:9.5px;font-weight:600" ><tspan x="14.0" dy="0.0">A  Basic self-awareness</tspan></text><text x="392.0" y="258.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="392.0" dy="0.0">the first reflection</tspan></text><rect x="10.0" y="222.0" width="90.0" height="20.0" rx="3" class="dg-line-2 dg-fill" opacity="0.41"/><text x="14.0" y="236.0" class="dg-text" text-anchor="start" style="font-size:9.5px;font-weight:600" ><tspan x="14.0" dy="0.0">SI  Survival instinct</tspan></text><rect x="10.0" y="200.0" width="120.0" height="20.0" rx="3" class="dg-line-2 dg-fill" opacity="0.47"/><text x="14.0" y="214.0" class="dg-text" text-anchor="start" style="font-size:9.5px;font-weight:600" ><tspan x="14.0" dy="0.0">L  Awareness of (self-imposed) limitations</tspan></text><text x="392.0" y="214.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="392.0" dy="0.0">A + SI</tspan></text><rect x="10.0" y="178.0" width="150.0" height="20.0" rx="3" class="dg-line-2 dg-fill" opacity="0.53"/><text x="14.0" y="192.0" class="dg-text" text-anchor="start" style="font-size:9.5px;font-weight:600" ><tspan x="14.0" dy="0.0">EX  Experience</tspan></text><text x="392.0" y="192.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="392.0" dy="0.0">learned, accepted parameters</tspan></text><rect x="10.0" y="156.0" width="180.0" height="20.0" rx="3" class="dg-line-2 dg-fill" opacity="0.59"/><text x="14.0" y="170.0" class="dg-text" text-anchor="start" style="font-size:9.5px;font-weight:600" ><tspan x="14.0" dy="0.0">C  Caution</tspan></text><text x="392.0" y="170.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="392.0" dy="0.0">alertness</tspan></text><rect x="10.0" y="134.0" width="210.0" height="20.0" rx="3" class="dg-line-2 dg-fill" opacity="0.65"/><text x="14.0" y="148.0" class="dg-text" text-anchor="start" style="font-size:9.5px;font-weight:600" ><tspan x="14.0" dy="0.0">W  Wariness</tspan></text><text x="392.0" y="148.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="392.0" dy="0.0">sensing &quot;bad vibes&quot;</tspan></text><rect x="10.0" y="112.0" width="240.0" height="20.0" rx="3" class="dg-line-2 dg-fill" opacity="0.71"/><text x="14.0" y="126.0" class="dg-text" text-anchor="start" style="font-size:9.5px;font-weight:600" ><tspan x="14.0" dy="0.0">F  Fear</tspan></text><text x="392.0" y="126.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="392.0" dy="0.0">protective / resistance, pain</tspan></text><rect x="10.0" y="90.0" width="270.0" height="20.0" rx="3" class="dg-line-2 dg-fill" opacity="0.77"/><text x="14.0" y="104.0" class="dg-text" text-anchor="start" style="font-size:9.5px;font-weight:600" ><tspan x="14.0" dy="0.0">PAR  Paranoia</tspan></text><text x="392.0" y="104.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="392.0" dy="0.0">irrational; negative beliefs only</tspan></text><rect x="10.0" y="68.0" width="300.0" height="20.0" rx="3" class="dg-line-2 dg-fill" opacity="0.83"/><text x="14.0" y="82.0" class="dg-text" text-anchor="start" style="font-size:9.5px;font-weight:600" ><tspan x="14.0" dy="0.0">PAN  Panic</tspan></text><text x="392.0" y="82.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="392.0" dy="0.0">phobias</tspan></text><rect x="10.0" y="46.0" width="330.0" height="20.0" rx="3" class="dg-line-2 dg-fill" opacity="0.89"/><text x="14.0" y="60.0" class="dg-text" text-anchor="start" style="font-size:9.5px;font-weight:600" ><tspan x="14.0" dy="0.0">T  Terror</tspan></text><text x="392.0" y="60.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="392.0" dy="0.0">life-threatening</tspan></text><rect x="10.0" y="24.0" width="360.0" height="20.0" rx="3" class="dg-line-2 dg-fill" opacity="0.95"/><text x="14.0" y="38.0" class="dg-text" text-anchor="start" style="font-size:9.5px;font-weight:600" ><tspan x="14.0" dy="0.0">DEATH</tspan></text><text x="392.0" y="38.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="392.0" dy="0.0">existential crisis, dissociation</tspan></text><line x1="396.0" y1="262.0" x2="396.0" y2="40.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/></svg>