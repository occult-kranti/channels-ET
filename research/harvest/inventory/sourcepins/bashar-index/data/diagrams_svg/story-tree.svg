<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="Story Tree" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">THE STORY TREE</tspan></text><rect x="160.0" y="220.0" width="80.0" height="40.0" rx="8" class="dg-line dg-fill" /><text x="200.0" y="244.0" class="dg-text" text-anchor="middle" style="font-size:10px" ><tspan x="200.0" dy="0.0">the experience</tspan></text><path d="M200,220 Q70,200 70,180" class="dg-line-2" /><rect x="38.0" y="149.0" width="64.0" height="32.0" rx="6" class="dg-line" /><text x="70.0" y="169.2" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="70.0" dy="0.0">A</tspan></text><line x1="70.0" y1="149.0" x2="70.0" y2="131.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="38.0" y="99.0" width="64.0" height="32.0" rx="6" class="dg-line" /><text x="70.0" y="119.2" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="70.0" dy="0.0">B</tspan></text><line x1="70.0" y1="99.0" x2="70.0" y2="81.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="38.0" y="49.0" width="64.0" height="32.0" rx="6" class="dg-line" /><text x="70.0" y="69.2" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="70.0" dy="0.0">C</tspan></text><text x="70.0" y="205.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="70.0" dy="-5.1">negative story (as</tspan><tspan x="70.0" dy="10.2">lived)</tspan></text><path d="M200,220 Q330,200 330,180" class="dg-line-2" /><rect x="298.0" y="149.0" width="64.0" height="32.0" rx="6" class="dg-line dg-fill-2" /><text x="330.0" y="169.2" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="330.0" dy="0.0">A′</tspan></text><line x1="330.0" y1="149.0" x2="330.0" y2="131.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="298.0" y="99.0" width="64.0" height="32.0" rx="6" class="dg-line dg-fill-2" /><text x="330.0" y="119.2" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="330.0" dy="0.0">B′</tspan></text><line x1="330.0" y1="99.0" x2="330.0" y2="81.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="298.0" y="49.0" width="64.0" height="32.0" rx="6" class="dg-line dg-fill-2" /><text x="330.0" y="69.2" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="330.0" dy="0.0">C′</tspan></text><text x="330.0" y="205.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="330.0" dy="-5.1">preferred story</tspan><tspan x="330.0" dy="10.2">(present tense)</tspan></text><rect x="160.0" y="120.0" width="80.0" height="34.0" rx="6" class="dg-line-2" /><text x="200.0" y="140.2" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="200.0" dy="-5.4">neutralise each</tspan><tspan x="200.0" dy="10.8">moment</tspan></text><line x1="102.0" y1="90.0" x2="158.0" y2="132.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><line x1="242.0" y1="132.0" x2="298.0" y2="90.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><text x="200.0" y="60.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="-5.1">each preferred moment</tspan><tspan x="200.0" dy="10.2">logically generates the next</tspan></text><text x="200.0" y="282.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">A/B/C slots and the process are from the 2016 session; whether the original is</tspan><tspan x="200.0" dy="11.4">drawn as a literal tree is unverified.</tspan></text></svg>