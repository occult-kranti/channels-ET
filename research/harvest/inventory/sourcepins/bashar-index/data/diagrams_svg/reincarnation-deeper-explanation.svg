<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 268" role="img" aria-label="Simultaneous incarnations" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:11.5px;font-weight:700" ><tspan x="200.0" dy="0.0">REINCARNATION — simultaneous, not sequential (concept)</tspan></text><text x="90.0" y="40.0" class="dg-muted" text-anchor="middle" style="font-size:9px" ><tspan x="90.0" dy="0.0">the usual picture</tspan></text><rect x="30.0" y="52.0" width="24.0" height="18.0" rx="3" class="dg-line-2" /><line x1="55.0" y1="61.0" x2="61.0" y2="61.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="62.0" y="52.0" width="24.0" height="18.0" rx="3" class="dg-line-2" /><line x1="87.0" y1="61.0" x2="93.0" y2="61.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="94.0" y="52.0" width="24.0" height="18.0" rx="3" class="dg-line-2" /><line x1="119.0" y1="61.0" x2="125.0" y2="61.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="126.0" y="52.0" width="24.0" height="18.0" rx="3" class="dg-line-2" /><line x1="151.0" y1="61.0" x2="157.0" y2="61.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="158.0" y="52.0" width="24.0" height="18.0" rx="3" class="dg-line-2" /><text x="90.0" y="86.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="90.0" dy="0.0">lives end to end</tspan></text><text x="280.0" y="40.0" class="dg-muted" text-anchor="middle" style="font-size:9px" ><tspan x="280.0" dy="0.0">Bashar&#x27;s picture</tspan></text><circle cx="280.0" cy="150.0" r="24.0" class="dg-line dg-fill-2" /><text x="280.0" y="154.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="280.0" dy="0.0">oversoul</tspan></text><line x1="259.2" y1="138.0" x2="212.5" y2="111.0" class="dg-line" /><rect x="201.5" y="103.0" width="22.0" height="16.0" rx="3" class="dg-line dg-fill" /><line x1="273.0" y1="127.0" x2="257.2" y2="75.4" class="dg-line" /><rect x="246.2" y="67.4" width="22.0" height