<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Thirteen basic principles" class="dg"><text x="200.0" y="15.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">BASHAR&#x27;S 13 BASIC PRINCIPLES</tspan></text><path d="M97.0,90.0 A70.0,70.0 0 0 1 127.7,97.6 L111.4,129.7 A34.0,34.0 0 0 0 96.5,126.0 Z" class="dg-line-2 dg-fill" /><text x="108.4" y="113.0" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="108.4" dy="0.0">1</tspan></text><path d="M129.4,98.5 A70.0,70.0 0 0 1 153.0,119.4 L123.7,140.3 A34.0,34.0 0 0 0 112.2,130.1 Z" class="dg-line-2 dg-fill-2" /><text x="130.5" y="124.6" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="130.5" dy="0.0">2</tspan></text><path d="M154.2,121.0 A70.0,70.0 0 0 1 165.4,150.6 L129.7,155.4 A34.0,34.0 0 0 0 124.2,141.1 Z" class="dg-line-2 dg-fill" /><text x="144.6" y="145.1" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="144.6" dy="0.0">3</tspan></text><path d="M165.6,152.5 A70.0,70.0 0 0 1 161.8,183.9 L128.0,171.6 A34.0,34.0 0 0 0 129.8,156.4 Z" class="dg-line-2 dg-fill-2" /><text x="147.6" y="169.8" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="147.6" dy="0.0">4</tspan></text><path d="M161.1,185.7 A70.0,70.0 0 0 1 143.1,211.7 L118.9,185.1 A34.0,34.0 0 0 0 127.6,172.5 Z" class="dg-line-2 dg-fill" /><text x="138.8" y="193.0" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="138.8" dy="0.0">5</tspan></text><path d="M141.7,213.0 A70.0,70.0 0 0 1 113.7,227.7 L104.6,192.9 A34.0,34.0 0 0 0 118.2,185.8 Z" class="dg-line-2 dg-fill-2" /><text x="120.2" y="209.5" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="120.2" dy="0.0">6</tspan></text><path d="M111.8,228.2 A70.0,70.0 0 0 1 80.2,228.2 L88.3,193.1 A34.0,34.0 0 0 0 103.7,193.1 Z" class="dg-line-2 dg-fill" /><text x="96.0" y="215.5" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="96.0" dy="0.0">7</tspan></text><path d="M78.3,227.7 A70.0,70.0 0 0 1 50.3,213.0 L73.8,185.8 A34.0,34.0 0 0 0 87.4,192.9 Z" class="dg-line-2 dg-fill-2" /><text x="71.8" y="209.5" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="71.8" dy="0.0">8</tspan></text><path d="M48.9,211.7 A70.0,70.0 0 0 1 30.9,185.7 L64.4,172.5 A34.0,34.0 0 0 0 73.1,185.1 Z" class="dg-line-2 dg-fill" /><text x="53.2" y="193.0" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="53.2" dy="0.0">9</tspan></text><path d="M30.2,183.9 A70.0,70.0 0 0 1 26.4,152.5 L62.2,156.4 A34.0,34.0 0 0 0 64.0,171.6 Z" class="dg-line-2 dg-fill-2" /><text x="44.4" y="169.8" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="44.4" dy="0.0">10</tspan></text><path d="M26.6,150.6 A70.0,70.0 0 0 1 37.8,121.0 L67.8,141.1 A34.0,34.0 0 0 0 62.3,155.4 Z" class="dg-line-2 dg-fill" /><text x="47.4" y="145.1" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="47.4" dy="0.0">11</tspan></text><path d="M39.0,119.4 A70.0,70.0 0 0 1 62.6,98.5 L79.8,130.1 A34.0,34.0 0 0 0 68.3,140.3 Z" class="dg-line-2 dg-fill-2" /><text x="61.5" y="124.6" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="61.5" dy="0.0">12</tspan></text><path d="M64.3,97.6 A70.0,70.0 0 0 1 95.0,90.0 L95.5,126.0 A34.0,34.0 0 0 0 80.6,129.7 Z" class="dg-line-2 dg-fill" /><text x="83.6" y="113.0" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="83.6" dy="0.0">13</tspan></text><text x="96.0" y="164.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="96.0" dy="0.0">you</tspan></text><text x="184.0" y="40.0" class="dg-muted" text-anchor="start" style="font-size:9px;font-weight:700" ><tspan x="184.0" dy="0.0">1.</tspan></text><text x="200.0" y="40.0" class="dg-text" text-anchor="start" style="font-size:8.2px" ><tspan x="200.0" dy="0.0">non-physical consciousness in physical reality</tspan></text><text x="184.0" y="59.0" class="dg-muted" text-anchor="start" style="font-size:9px;font-weight:700" ><tspan x="184.0" dy="0.0">2.</tspan></text><text x="200.0" y="59.0" class="dg-text" text-anchor="start" style="font-size:8.2px" ><tspan x="200.0" dy="0.0">you chose to be here; ecstasy is your birthright</tspan></text><text x="184.0" y="78.0" class="dg-muted" text-anchor="start" style="font-size:9px;font-weight:700" ><tspan x="184.0" dy="0.0">3.</tspan></text><text x="200.0" y="78.0" class="dg-text" text-anchor="start" style="font-size:8.2px" ><tspan x="200.0" dy="0.0">highest purpose: be yourself fully</tspan></text><text x="184.0" y="97.0" class="dg-muted" text-anchor="start" style="font-size:9px;font-weight:700" ><tspan x="184.0" dy="0.0">4.</tspan></text><text x="200.0" y="97.0" class="dg-text" text-anchor="start" style="font-size:8.2px" ><tspan x="200.0" dy="0.0">free will, always</tspan></text><text x="184.0" y="116.0" class="dg-muted" text-anchor="start" style="font-size:9px;font-weight:700" ><tspan x="184.0" dy="0.0">5.</tspan></text><text x="200.0" y="116.0" class="dg-text" text-anchor="start" style="font-size:8.2px" ><tspan x="200.0" dy="0.0">anything relevant to your theme is possible</tspan></text><text x="184.0" y="135.0" class="dg-muted" text-anchor="start" style="font-size:9px;font-weight:700" ><tspan x="184.0" dy="0.0">6.</tspan></text><text x="200.0" y="135.0" class="dg-text" text-anchor="start" style="font-size:8.2px" ><tspan x="200.0" dy="0.0">beliefs + emotions + actions attract experience</tspan></text><text x="184.0" y="154.0" class="dg-muted" text-anchor="start" style="font-size:9px;font-weight:700" ><tspan x="184.0" dy="0.0">7.</tspan></text><text x="200.0" y="154.0" class="dg-text" text-anchor="start" style="font-size:8.2px" ><tspan x="200.0" dy="0.0">excitement = your core vibration; follow it</tspan></text><text x="184.0" y="173.0" class="dg-muted" text-anchor="start" style="font-size:9px;font-weight:700" ><tspan x="184.0" dy="0.0">8.</tspan></text><text x="200.0" y="173.0" class="dg-text" text-anchor="start" style="font-size:8.2px" ><tspan x="200.0" dy="0.0">naturally abundant, always supported</tspan></text><text x="184.0" y="192.0" class="dg-muted" text-anchor="start" style="font-size:9px;font-weight:700" ><tspan x="184.0" dy="0.0">9.</tspan></text><text x="200.0" y="192.0" class="dg-text" text-anchor="start" style="font-size:8.2px" ><tspan x="200.0" dy="0.0">only one moment in creation</tspan></text><text x="184.0" y="211.0" class="dg-muted" text-anchor="start" style="font-size:9px;font-weight:700" ><tspan x="184.0" dy="0.0">10.</tspan></text><text x="200.0" y="211.0" class="dg-text" text-anchor="start" style="font-size:8.2px" ><tspan x="200.0" dy="0.0">you create past &amp; future from now</tspan></text><text x="184.0" y="230.0" class="dg-muted" text-anchor="start" style="font-size:9px;font-weight:700" ><tspan x="184.0" dy="0.0">11.</tspan></text><text x="200.0" y="230.0" class="dg-text" text-anchor="start" style="font-size:8.2px" ><tspan x="200.0" dy="0.0">you are eternal</tspan></text><text x="184.0" y="249.0" class="dg-muted" text-anchor="start" style="font-size:9px;font-weight:700" ><tspan x="184.0" dy="0.0">12.</tspan></text><text x="200.0" y="249.0" class="dg-text" text-anchor="start" style="font-size:8.2px" ><tspan x="200.0" dy="0.0">everything you experience is another aspect of you</tspan></text><text x="184.0" y="268.0" class="dg-muted" text-anchor="start" style="font-size:9px;font-weight:700" ><tspan x="184.0" dy="0.0">13.</tspan></text><text x="200.0" y="268.0" class="dg-text" text-anchor="start" style="font-size:8.2px" ><tspan x="200.0" dy="0.0">loved so unconditionally you can believe you are not</tspan></text></svg>