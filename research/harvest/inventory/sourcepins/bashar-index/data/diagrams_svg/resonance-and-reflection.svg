<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 268" role="img" aria-label="Resonance reflection" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">RESONANCE &amp; REFLECTION (concept)</tspan></text><circle cx="60.0" cy="140.0" r="22.0" class="dg-line dg-fill-2" /><text x="60.0" y="144.0" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:600" ><tspan x="60.0" dy="0.0">you</tspan></text><text x="60.0" y="176.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="60.0" dy="0.0">state of being</tspan></text><line x1="320.0" y1="60.0" x2="320.0" y2="220.0" class="dg-line" /><text x="340.0" y="140.0" class="dg-muted" text-anchor="start" style="font-size:9px" transform="rotate(90 340 140)"><tspan x="340.0" dy="0.0">the mirror</tspan></text><path d="M90,120 q10,-14 20,0 t20,0 q10,-14 20,0 t20,0 q10,-14 20,0 t20,0 q10,-14 20,0 t20,0 q10,-14 20,0 t20,0" class="dg-accent" marker-end="url(#dg-arrow)"/><text x="200.0" y="100.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="0.0">frequency you generate</tspan></text><path d="M310,160 q-10,14 -20,0 t-20,0 q-10,14 -20,0 t-20,0 q-10,14 -20,0 t-20,0 q-10,14 -20,0 t-20,0 q-10,14 -20,0 t-20,0" class="dg-accent" marker-end="url(#dg-arrow)"/><text x="200.0" y="190.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="0.0">reflected back as experience</tspan></text><text x="200.0" y="246.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="200.0" dy="-5.4">&quot;what you put out is what you get back&quot; — non-matching frequencies</tspan><tspan x="200.0" dy="10.8">simply aren&#x27;t reflected</tspan></text></svg>