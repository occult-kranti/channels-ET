<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-label="Belief-emotion-thought-action chain" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:11.5px;font-weight:700" ><tspan x="200.0" dy="0.0">BELIEF → EMOTION → THOUGHT → ACTION → EXPERIENCE</tspan></text><rect x="8.0" y="44.0" width="70.0" height="44.0" rx="6" class="dg-line dg-fill-2" /><text x="43.0" y="69.3" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:600" ><tspan x="43.0" dy="-5.7">Belief /</tspan><tspan x="43.0" dy="11.4">definition</tspan></text><line x1="79.0" y1="66.0" x2="85.0" y2="66.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="86.0" y="44.0" width="70.0" height="44.0" rx="6" class="dg-line dg-fill" /><text x="121.0" y="69.3" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="121.0" dy="0.0">Emotion</tspan></text><line x1="157.0" y1="66.0" x2="163.0" y2="66.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="164.0" y="44.0" width="70.0" height="44.0" rx="6" class="dg-line dg-fill" /><text x="199.0" y="69.3" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="199.0" dy="0.0">Thought</tspan></text><line x1="235.0" y1="66.0" x2="241.0" y2="66.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="242.0" y="44.0" width="70.0" height="44.0" rx="6" class="dg-line dg-fill" /><text x="277.0" y="69.3" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="277.0" dy="-5.7">Action /</tspan><tspan x="277.0" dy="11.4">behaviour</tspan></text><line x1="313.0" y1="66.0" x2="319.0" y2="66.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="320.0" y="44.0" width="70.0" height="44.0" rx="6" class="dg-line dg-fill" /><text x="355.0" y="69.3" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="355.0" dy="0.0">Experience</tspan></text><path d="M357,90 Q357,120 200,120 Q43,120 43,90" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><text x="200.0" y="133.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="0.0">experience appears to confirm the belief (feedback)</tspan></text><rect x="20.0" y="158.0" width="170.0" height="100.0" rx="6" class="dg-line-2" /><text x="105.0" y="176.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:600" ><tspan x="105.0" dy="0.0">Circumstances</tspan></text><line x1="60.0" y1="176.0" x2="150.0" y2="176.0" class="dg-accent" /><text x="105.0" y="200.0" class="dg-muted" text-anchor="middle" style="font-size:9px" ><tspan x="105.0" dy="-5.4">neutral props — no</tspan><tspan x="105.0" dy="10.8">built-in meaning</tspan></text><text x="105.0" y="238.0" class="dg-text" text-anchor="middle" style="font-size:9px;font-style:italic" ><tspan x="105.0" dy="0.0">&quot;circumstances don&#x27;t matter&quot;</tspan></text><rect x="210.0" y="158.0" width="170.0" height="100.0" rx="6" class="dg-line dg-fill-2" /><text x="295.0" y="176.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:600" ><tspan x="295.0" dy="0.0">State of being</tspan></text><text x="295.0" y="200.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="295.0" dy="-5.4">the cause: what you put</tspan><tspan x="295.0" dy="10.8">out is what you get back</tspan></text><text x="295.0" y="238.0" class="dg-text" text-anchor="middle" style="font-size:9px;font-style:italic" ><tspan x="295.0" dy="0.0">&quot;only state of being matters&quot;</tspan></text></svg>