<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 275" role="img" aria-label="Window of Discovery form" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">WINDOW OF DISCOVERY: 2018–2020</tspan></text><text x="200.0" y="30.0" class="dg-muted" text-anchor="middle" style="font-size:9px" ><tspan x="200.0" dy="0.0">Bashar event, December 1st, 2017 · please print clearly</tspan></text><rect x="20.0" y="42.0" width="170.0" height="150.0" rx="6" class="dg-line dg-fill" /><text x="105.0" y="60.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:700" ><tspan x="105.0" dy="0.0">NEGATIVE</tspan></text><text x="105.0" y="92.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="105.0" dy="-10.2">What do you REALLY believe is a</tspan><tspan x="105.0" dy="10.2">highly probable negative event in</tspan><tspan x="105.0" dy="10.2">the next 3 years?</tspan></text><line x1="34.0" y1="140.0" x2="176.0" y2="140.0" class="dg-line-2" /><line x1="34.0" y1="164.0" x2="176.0" y2="164.0" class="dg-line-2" /><rect x="210.0" y="42.0" width="170.0" height="150.0" rx="6" class="dg-line dg-fill-2" /><text x="295.0" y="60.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:700" ><tspan x="295.0" dy="0.0">POSITIVE</tspan></text><text x="295.0" y="92.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="295.0" dy="-5.1">…highly probable positive event in</tspan><tspan x="295.0" dy="10.2">the next 3 years?</tspan></text><line x1="224.0" y1="140.0" x2="366.0" y2="140.0" class="dg-line-2" /><line x1="224.0" y1="164.0" x2="366.0" y2="164.0" class="dg-line-2" /><text x="200.0" y="214.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="-5.1">DO NOT write what you want — write what you honestly believe is most likely. DO</tspan><tspan x="200.0" dy="10.2">NOT discuss. DO NOT erase your gut answer.</tspan></text><rect x="150.0" y="236.0" width="100.0" height="24.0" rx="12" class="dg-ink-fill" /><text x="200.0" y="252.0" class="dg-inv" text-anchor="middle" style="font-size:9.5px;font-weight:700" ><tspan x="200.0" dy="0.0">YOU HAVE 3 MINUTES</tspan></text></svg>