<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="The Formula five steps" class="dg"><text x="200.0" y="18.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">THE FORMULA  ·  follow your highest excitement</tspan></text><circle cx="28.0" cy="52.0" r="13.0" class="dg-ink-fill" /><text x="28.0" y="56.5" class="dg-inv" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="28.0" dy="0.0">1</tspan></text><rect x="50.0" y="32.0" width="342.0" height="40.0" rx="6" class="dg-line dg-fill" /><text x="221.0" y="56.0" class="dg-text" text-anchor="middle" style="font-size:10.5px" ><tspan x="221.0" dy="-6.3">Act on your highest excitement, in the moment, every</tspan><tspan x="221.0" dy="12.6">moment you can</tspan></text><line x1="28.0" y1="66.0" x2="28.0" y2="78.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><circle cx="28.0" cy="100.0" r="13.0" class="dg-ink-fill" /><text x="28.0" y="104.5" class="dg-inv" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="28.0" dy="0.0">2</tspan></text><rect x="50.0" y="80.0" width="342.0" height="40.0" rx="6" class="dg-line dg-fill" /><text x="221.0" y="104.0" class="dg-text" text-anchor="middle" style="font-size:10.5px" ><tspan x="221.0" dy="0.0">To the best of your ability — take it as far as you can</tspan></text><line x1="28.0" y1="114.0" x2="28.0" y2="126.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><circle cx="28.0" cy="148.0" r="13.0" class="dg-ink-fill" /><text x="28.0" y="152.5" class="dg-inv" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="28.0" dy="0.0">3</tspan></text><rect x="50.0" y="128.0" width="342.0" height="40.0" rx="6" class="dg-line dg-fill" /><text x="221.0" y="152.0" class="dg-text" text-anchor="middle" style="font-size:10.5px" ><tspan x="221.0" dy="-6.3">With zero insistence, assumption or expectation of the</tspan><tspan x="221.0" dy="12.6">outcome</tspan></text><line x1="28.0" y1="162.0" x2="28.0" y2="174.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><circle cx="28.0" cy="196.0" r="13.0" class="dg-ink-fill" /><text x="28.0" y="200.5" class="dg-inv" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="28.0" dy="0.0">4</tspan></text><rect x="50.0" y="176.0" width="342.0" height="40.0" rx="6" class="dg-line dg-fill-2" /><text x="221.0" y="200.0" class="dg-text" text-anchor="middle" style="font-size:10.5px" ><tspan x="221.0" dy="0.0">Stay in a positive state regardless of what happens</tspan></text><line x1="28.0" y1="210.0" x2="28.0" y2="222.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><circle cx="28.0" cy="244.0" r="13.0" class="dg-ink-fill" /><text x="28.0" y="248.5" class="dg-inv" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="28.0" dy="0.0">5</tspan></text><rect x="50.0" y="224.0" width="342.0" height="40.0" rx="6" class="dg-line dg-fill-2" /><text x="221.0" y="248.0" class="dg-text" text-anchor="middle" style="font-size:10.5px" ><tspan x="221.0" dy="-6.3">Constantly investigate your beliefs; release and replace</tspan><tspan x="221.0" dy="12.6">the fear-based ones</tspan></text><text x="200.0" y="282.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">Five steps verbatim in spirit from bashar.org/formula (steps 1–3 are &quot;the</tspan><tspan x="200.0" dy="11.4">formula&quot;, 4–5 the supporting practice).</tspan></text></svg>