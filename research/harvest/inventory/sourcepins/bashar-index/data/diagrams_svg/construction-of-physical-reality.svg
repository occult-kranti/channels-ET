<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="Descent from the One" class="dg"><text x="200.0" y="15.0" class="dg-text" text-anchor="middle" style="font-size:10.5px;font-weight:700" ><tspan x="200.0" dy="0.0">FROM THE ONE TO THE PERSONALITY — construction of physical reality</tspan></text><rect x="80.0" y="26.0" width="240.0" height="21.0" rx="3" class="dg-line-2 dg-fill-2" /><text x="200.0" y="40.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="0.0">The One / Infinite</tspan></text><line x1="340.0" y1="30.0" x2="340.0" y2="48.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="80.0" y="51.0" width="240.0" height="21.0" rx="3" class="dg-line-2 dg-fill-2" /><text x="200.0" y="65.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="0.0">First reflection (angelic)</tspan></text><line x1="340.0" y1="55.0" x2="340.0" y2="73.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="80.0" y="76.0" width="240.0" height="21.0" rx="3" class="dg-line-2 dg-fill-2" /><text x="200.0" y="90.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="0.0">Trinity: original · reflection · balance point</tspan></text><polygon points="50.0,95.0 62.0,78.0 74.0,95.0" class="dg-line" /><line x1="340.0" y1="80.0" x2="340.0" y2="98.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="80.0" y="101.0" width="240.0" height="21.0" rx="3" class="dg-line-2 dg-fill-2" /><text x="200.0" y="115.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="0.0">Vesica piscis</tspan></text><circle cx="56.0" cy="111.0" r="8.0" class="dg-line-2" /><circle cx="66.0" cy="111.0" r="8.0" class="dg-line-2" /><line x1="340.0" y1="105.0" x2="340.0" y2="123.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="80.0" y="126.0" width="240.0" height="21.0" rx="3" class="dg-line-2 dg-fill-2" /><text x="200.0" y="140.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="0.0">Oversoul</tspan></text><line x1="340.0" y1="130.0" x2="340.0" y2="148.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="80.0" y="151.0" width="240.0" height="21.0" rx="3" class="dg-line-2 dg-fill" /><text x="200.0" y="165.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="0.0">Individual soul = higher mind + physical mind</tspan></text><line x1="340.0" y1="155.0" x2="340.0" y2="173.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="80.0" y="176.0" width="240.0" height="21.0" rx="3" class="dg-line-2 dg-fill" /><text x="200.0" y="190.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="0.0">Template level</tspan></text><line x1="340.0" y1="180.0" x2="340.0" y2="198.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="80.0" y="201.0" width="240.0" height="21.0" rx="3" class="dg-line-2 dg-fill" /><text x="200.0" y="215.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="0.0">Pineal gland (interface)</tspan></text><line x1="340.0" y1="205.0" x2="340.0" y2="223.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="80.0" y="226.0" width="240.0" height="21.0" rx="3" class="dg-line-2 dg-fill" /><text x="200.0" y="240.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="0.0">Personality: beliefs · emotions · actions</tspan></text><line x1="340.0" y1="230.0" x2="340.0" y2="248.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="80.0" y="251.0" width="240.0" height="21.0" rx="3" class="dg-line-2 dg-fill" /><text x="200.0" y="265.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="200.0" dy="0.0">Physical reality</tspan></text><text x="200.0" y="282.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="0.0">Compiled from several sessions by a secondary source; not an official handout.</tspan></text></svg>