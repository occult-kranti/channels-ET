<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 268" role="img" aria-label="1-3-5-7-11 tiers" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">THE 1-3-5-7-11 DOWNLOAD</tspan></text><rect x="140.0" y="30.0" width="120.0" height="40.0" rx="6" class="dg-line dg-fill-2" /><text x="162.0" y="55.0" class="dg-text" text-anchor="middle" style="font-size:16px;font-weight:700" ><tspan x="162.0" dy="0.0">1</tspan></text><text x="214.0" y="54.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="214.0" dy="-5.4">the One —</tspan><tspan x="214.0" dy="10.8">existence</tspan></text><rect x="107.0" y="76.0" width="186.0" height="40.0" rx="6" class="dg-line dg-fill" /><text x="129.0" y="101.0" class="dg-text" text-anchor="middle" style="font-size:16px;font-weight:700" ><tspan x="129.0" dy="0.0">3</tspan></text><text x="214.0" y="100.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="214.0" dy="-10.8">the trinity: original ·</tspan><tspan x="214.0" dy="10.8">reflection · balance</tspan><tspan x="214.0" dy="10.8">point</tspan></text><rect x="74.0" y="122.0" width="252.0" height="40.0" rx="6" class="dg-line dg-fill-2" /><text x="96.0" y="147.0" class="dg-text" text-anchor="middle" style="font-size:16px;font-weight:700" ><tspan x="96.0" dy="0.0">5</tspan></text><text x="214.0" y="146.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="214.0" dy="0.0">the five laws of creation</tspan></text><rect x="41.0" y="168.0" width="318.0" height="40.0" rx="6" class="dg-line dg-fill" /><text x="63.0" y="193.0" class="dg-text" text-anchor="middle" style="font-size:16px;font-weight:700" ><tspan x="63.0" dy="0.0">7</tspan></text><text x="214.0" y="192.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="214.0" dy="-5.4">seven neutral needs: air, water, sleep/dream,</tspan><tspan x="214.0" dy="10.8">food, shelter, connection, creative expression</tspan></text><rect x="8.0" y="214.0" width="384.0" height="40.0" rx="6" class="dg-line dg-fill-2" /><text x="30.0" y="239.0" class="dg-text" text-anchor="middle" style="font-size:16px;font-weight:700" ><tspan x="30.0" dy="0.0">11</tspan></text><text x="214.0" y="238.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="214.0" dy="0.0">the formula: 4 steps + 7 tools</tspan></text></svg>