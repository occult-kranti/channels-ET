<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Hour of Power clock of 12 affirmations" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:11.5px;font-weight:700" ><tspan x="200.0" dy="0.0">THE HOUR OF POWER — 12 affirmations × ~5 minutes</tspan></text><path d="M201.7,65.0 A100.0,100.0 0 0 1 248.5,77.5 L225.2,119.5 A52.0,52.0 0 0 0 200.9,113.0 Z" class="dg-line-2 dg-fill" /><text x="219.7" y="95.6" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:700" ><tspan x="219.7" dy="0.0">1</tspan></text><text x="231.6" y="50.2" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="231.6" dy="-4.5">I am who I am for</tspan><tspan x="231.6" dy="9.0">a reason</tspan></text><path d="M251.5,79.3 A100.0,100.0 0 0 1 285.7,113.5 L244.6,138.2 A52.0,52.0 0 0 0 226.8,120.4 Z" class="dg-line-2 dg-fill-2" /><text x="253.7" y="115.3" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:700" ><tspan x="253.7" dy="0.0">2</tspan></text><text x="286.3" y="81.7" class="dg-text" text-anchor="start" style="font-size:8px" ><tspan x="286.3" dy="-4.5">No insistence, no</tspan><tspan x="286.3" dy="9.0">resistance</tspan></text><path d="M287.5,116.5 A100.0,100.0 0 0 1 300.0,163.3 L252.0,164.1 A52.0,52.0 0 0 0 245.5,139.8 Z" class="dg-line-2 dg-fill" /><text x="273.4" y="149.3" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:700" ><tspan x="273.4" dy="0.0">3</tspan></text><text x="317.8" y="136.4" class="dg-text" text-anchor="start" style="font-size:8px" ><tspan x="317.8" dy="-9.0">I am</tspan><tspan x="317.8" dy="9.0">indestructible at</tspan><tspan x="317.8" dy="9.0">my core</tspan></text><path d="M300.0,166.7 A100.0,100.0 0 0 1 287.5,213.5 L245.5,190.2 A52.0,52.0 0 0 0 252.0,165.9 Z" class="dg-line-2 dg-fill-2" /><text x="273.4" y="188.7" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:700" ><tspan x="273.4" dy="0.0">4</tspan></text><text x="317.8" y="199.6" class="dg-text" text-anchor="start" style="font-size:8px" ><tspan x="317.8" dy="-9.0">Past &amp; future are</tspan><tspan x="317.8" dy="9.0">illusions — now is</tspan><tspan x="317.8" dy="9.0">all</tspan></text><path d="M285.7,216.5 A100.0,100.0 0 0 1 251.5,250.7 L226.8,209.6 A52.0,52.0 0 0 0 244.6,191.8 Z" class="dg-line-2 dg-fill" /><text x="253.7" y="222.7" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:700" ><tspan x="253.7" dy="0.0">5</tspan></text><text x="286.3" y="254.3" class="dg-text" text-anchor="start" style="font-size:8px" ><tspan x="286.3" dy="-4.5">Perfect timing; I</tspan><tspan x="286.3" dy="9.0">miss nothing</tspan></text><path d="M248.5,252.5 A100.0,100.0 0 0 1 201.7,265.0 L200.9,217.0 A52.0,52.0 0 0 0 225.2,210.5 Z" class="dg-line-2 dg-fill-2" /><text x="219.7" y="242.4" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:700" ><tspan x="219.7" dy="0.0">6</tspan></text><text x="231.6" y="285.8" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="231.6" dy="0.0">My life is my own</tspan></text><path d="M198.3,265.0 A100.0,100.0 0 0 1 151.5,252.5 L174.8,210.5 A52.0,52.0 0 0 0 199.1,217.0 Z" class="dg-line-2 dg-fill" /><text x="180.3" y="242.4" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:700" ><tspan x="180.3" dy="0.0">7</tspan></text><text x="168.4" y="285.8" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="168.4" dy="-9.0">Unconditionally</tspan><tspan x="168.4" dy="9.0">supported by</tspan><tspan x="168.4" dy="9.0">creation</tspan></text><path d="M148.5,250.7 A100.0,100.0 0 0 1 114.3,216.5 L155.4,191.8 A52.0,52.0 0 0 0 173.2,209.6 Z" class="dg-line-2 dg-fill-2" /><text x="146.3" y="222.7" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:700" ><tspan x="146.3" dy="0.0">8</tspan></text><text x="113.7" y="254.3" class="dg-text" text-anchor="end" style="font-size:8px" ><tspan x="113.7" dy="-4.5">I am an expression</tspan><tspan x="113.7" dy="9.0">of nature</tspan></text><path d="M112.5,213.5 A100.0,100.0 0 0 1 100.0,166.7 L148.0,165.9 A52.0,52.0 0 0 0 154.5,190.2 Z" class="dg-line-2 dg-fill" /><text x="126.6" y="188.7" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:700" ><tspan x="126.6" dy="0.0">9</tspan></text><text x="82.2" y="199.6" class="dg-text" text-anchor="end" style="font-size:8px" ><tspan x="82.2" dy="-4.5">I always have what</tspan><tspan x="82.2" dy="9.0">I need</tspan></text><path d="M100.0,163.3 A100.0,100.0 0 0 1 112.5,116.5 L154.5,139.8 A52.0,52.0 0 0 0 148.0,164.1 Z" class="dg-line-2 dg-fill-2" /><text x="126.6" y="149.3" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:700" ><tspan x="126.6" dy="0.0">10</tspan></text><text x="82.2" y="136.4" class="dg-text" text-anchor="end" style="font-size:8px" ><tspan x="82.2" dy="-9.0">I give &amp; receive</tspan><tspan x="82.2" dy="9.0">joy, love,</tspan><tspan x="82.2" dy="9.0">compassion</tspan></text><path d="M114.3,113.5 A100.0,100.0 0 0 1 148.5,79.3 L173.2,120.4 A52.0,52.0 0 0 0 155.4,138.2 Z" class="dg-line-2 dg-fill" /><text x="146.3" y="115.3" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:700" ><tspan x="146.3" dy="0.0">11</tspan></text><text x="113.7" y="81.7" class="dg-text" text-anchor="end" style="font-size:8px" ><tspan x="113.7" dy="-9.0">My life is a</tspan><tspan x="113.7" dy="9.0">synchronous</tspan><tspan x="113.7" dy="9.0">orchestration</tspan></text><path d="M151.5,77.5 A100.0,100.0 0 0 1 198.3,65.0 L199.1,113.0 A52.0,52.0 0 0 0 174.8,119.5 Z" class="dg-line-2 dg-fill-2" /><text x="180.3" y="95.6" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:700" ><tspan x="180.3" dy="0.0">12</tspan></text><text x="168.4" y="50.2" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="168.4" dy="-4.5">I am free to</tspan><tspan x="168.4" dy="9.0">choose</tspan></text><text x="200.0" y="161.0" class="dg-text" text-anchor="middle" style="font-size:16px;font-weight:700" ><tspan x="200.0" dy="0.0">60</tspan></text><text x="200.0" y="175.0" class="dg-muted" text-anchor="middle" style="font-size:8px" ><tspan x="200.0" dy="0.0">minutes</tspan></text></svg>