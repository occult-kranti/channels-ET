<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-label="Crystal techniques" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:10.5px;font-weight:700" ><tspan x="200.0" dy="0.0">CRYSTAL TECHNIQUES — the pyramid antenna (the only geometric spec)</tspan></text><polygon points="120.0,60.0 200.0,200.0 40.0,200.0" class="dg-line dg-fill" /><rect x="30.0" y="200.0" width="180.0" height="8.0" rx="0" class="dg-copper" /><line x1="120.0" y1="40.0" x2="120.0" y2="200.0" class="dg-copper" /><polygon points="112.0,68.0 120.0,48.0 128.0,68.0" class="dg-line-2 dg-fill-2" /><text x="120.0" y="232.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="120.0" dy="-10.2">clay pyramid, Giza proportions · copper base</tspan><tspan x="120.0" dy="10.2">plate · copper rod through the apex crystal</tspan><tspan x="120.0" dy="10.2">— &quot;a lens for magnetism&quot;</tspan></text><circle cx="300.0" cy="110.0" r="30.0" class="dg-line-2" /><path d="M300,80 L300,140" class="dg-line-2" /><text x="300.0" y="152.0" class="dg-muted" text-anchor="middle" style="font-size:8px" ><tspan x="300.0" dy="-9.6">stone bell: a crystal</tspan><tspan x="300.0" dy="9.6">slice rung under water</tspan><tspan x="300.0" dy="9.6">above the heart</tspan></text><circle cx="250.0" cy="200.0" r="8.0" class="dg-white" /><text x="250.0" y="218.0" class="dg-muted" text-anchor="middle" style="font-size:7.5px" ><tspan x="250.0" dy="0.0">quartz</tspan></text><circle cx="282.0" cy="200.0" r="8.0" class="dg-rose" /><text x="282.0" y="218.0" class="dg-muted" text-anchor="middle" style="font-size:7.5px" ><tspan x="282.0" dy="0.0">rose</tspan></text><circle cx="314.0" cy="200.0" r="8.0" class="dg-violet" /><text x="314.0" y="218.0" class="dg-muted" text-anchor="middle" style="font-size:7.5px" ><tspan x="314.0" dy="0.0">amethyst</tspan></text><circle cx="346.0" cy="200.0" r="8.0" class="dg-grey" /><text x="346.0" y="218.0" class="dg-muted" text-anchor="middle" style="font-size:7.5px" ><tspan x="346.0" dy="0.0">hematite</tspan></text><text x="298.0" y="238.0" class="dg-muted" text-anchor="middle" style="font-size:8px" ><tspan x="298.0" dy="0.0">personal grid, arranged by intuition</tspan></text></svg>