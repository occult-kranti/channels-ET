<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 278" role="img" aria-label="Density ladder" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">DENSITY vs DIMENSION</tspan></text><rect x="70.0" y="34.0" width="250.0" height="52.0" rx="6" class="dg-line dg-fill-2" /><text x="195.0" y="52.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:700" ><tspan x="195.0" dy="0.0">5th density</tspan></text><text x="195.0" y="72.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="195.0" dy="0.0">non-physical light; Essassani upper range</tspan></text><path d="M30,70 q4,-8 0,-16 q-4,-6 0,-10" class="dg-line-2" /><path d="M40,70 q4,-8 0,-16 q-4,-6 0,-10" class="dg-line-2" /><path d="M50,70 q4,-8 0,-16 q-4,-6 0,-10" class="dg-line-2" /><text x="40.0" y="84.0" class="dg-muted" text-anchor="middle" style="font-size:8px" ><tspan x="40.0" dy="0.0">steam</tspan></text><rect x="70.0" y="96.0" width="250.0" height="52.0" rx="6" class="dg-line dg-fill" /><text x="195.0" y="114.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:700" ><tspan x="195.0" dy="0.0">4th density</tspan></text><text x="195.0" y="134.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="195.0" dy="-5.1">transitional, telepathic; Earth&#x27;s shift; Yahyel</tspan><tspan x="195.0" dy="10.2">/ Essassani lower range</tspan></text><path d="M26,122 q7,-8 14,0 t14,0" class="dg-line" /><path d="M26,130 q7,-8 14,0 t14,0" class="dg-line-2" /><text x="40.0" y="146.0" class="dg-muted" text-anchor="middle" style="font-size:8px" ><tspan x="40.0" dy="0.0">water</tspan></text><rect x="70.0" y="158.0" width="250.0" height="52.0" rx="6" class="dg-line dg-fill" /><text x="195.0" y="176.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:700" ><tspan x="195.0" dy="0.0">3rd density</tspan></text><text x="195.0" y="196.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="195.0" dy="0.0">self-aware physical humanity — Earth now</tspan></text><rect x="28.0" y="172.0" width="24.0" height="24.0" rx="2" class="dg-line" /><line x1="28.0" y1="184.0" x2="52.0" y2="184.0" class="dg-line-2" /><line x1="40.0" y1="172.0" x2="40.0" y2="196.0" class="dg-line-2" /><text x="40.0" y="208.0" class="dg-muted" text-anchor="middle" style="font-size:8px" ><tspan x="40.0" dy="0.0">ice</tspan></text><line x1="340.0" y1="120.0" x2="340.0" y2="44.0" class="dg-line" marker-end="url(#dg-arrow)"/><text x="352.0" y="84.0" class="dg-muted" text-anchor="start" style="font-size:9px" ><tspan x="352.0" dy="0.0">the shift</tspan></text><text x="200.0" y="236.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="200.0" dy="-5.4">dimension = coordinates of space/time (where) · density = vibrational</tspan><tspan x="200.0" dy="10.8">state (how fast/fine)</tspan></text><text x="200.0" y="270.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">Only the 3rd/4th/5th tiers are attested in the sources used; the ice/water/steam</tspan><tspan x="200.0" dy="11.4">icons are an analogy.</tspan></text></svg>