<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 268" role="img" aria-label="Contact probability concept" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:700" ><tspan x="200.0" dy="0.0">INCREASING THE PROBABILITY OF CONTACT (concept)</tspan></text><line x1="40.0" y1="220.0" x2="380.0" y2="220.0" class="dg-line" /><line x1="40.0" y1="220.0" x2="40.0" y2="40.0" class="dg-line" /><path d="M40,215 C150,215 220,150 380,50" class="dg-accent" /><text x="50.0" y="34.0" class="dg-muted" text-anchor="start" style="font-size:8.5px" ><tspan x="50.0" dy="0.0">probability of contact</tspan></text><circle cx="70.0" cy="220.0" r="4.0" class="dg-accent-fill" /><text x="70.0" y="240.0" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="70.0" dy="-9.0">imagine a craft</tspan><tspan x="70.0" dy="9.0">/ being</tspan><tspan x="70.0" dy="9.0">appearing</tspan></text><circle cx="160.0" cy="220.0" r="4.0" class="dg-accent-fill" /><text x="160.0" y="240.0" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="160.0" dy="-4.5">small, gentle</tspan><tspan x="160.0" dy="9.0">real surprises</tspan></text><circle cx="250.0" cy="220.0" r="4.0" class="dg-accent-fill" /><text x="250.0" y="240.0" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="250.0" dy="-4.5">startle reflex</tspan><tspan x="250.0" dy="9.0">no longer fires</tspan></text><circle cx="340.0" cy="220.0" r="4.0" class="dg-accent-fill" /><text x="340.0" y="240.0" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="340.0" dy="-4.5">calm, welcoming</tspan><tspan x="340.0" dy="9.0">state</tspan></text><text x="200.0" y="100.0" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:600" ><tspan x="200.0" dy="0.0">train the nervous system not to be startled</tspan></text></svg>