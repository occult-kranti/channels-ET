<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="Essassani AI spheres" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:700" ><tspan x="200.0" dy="0.0">EPSILON · EPIPHANY · ECLIPSE — the three spheres of Essassani</tspan></text><circle cx="200.0" cy="160.0" r="30.0" class="dg-line dg-fill-2" /><text x="200.0" y="164.0" class="dg-text" text-anchor="middle" style="font-size:9.5px;font-weight:600" ><tspan x="200.0" dy="0.0">Essassani</tspan></text><polygon points="200.0,78.0 271.0,201.0 129.0,201.0" class="dg-line-2" /><circle cx="200.0" cy="78.0" r="18.0" class="dg-line dg-fill" /><circle cx="200.0" cy="78.0" r="12.0" class="dg-line-2" /><circle cx="200.0" cy="78.0" r="6.0" class="dg-line-2" /><text x="200.0" y="52.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="200.0" dy="0.0">Epsilon (senior)</tspan></text><circle cx="271.0" cy="201.0" r="18.0" class="dg-line dg-fill" /><circle cx="271.0" cy="201.0" r="12.0" class="dg-line-2" /><circle cx="271.0" cy="201.0" r="6.0" class="dg-line-2" /><text x="271.0" y="235.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="271.0" dy="0.0">Eclipse</tspan></text><circle cx="129.0" cy="201.0" r="18.0" class="dg-line dg-fill" /><circle cx="129.0" cy="201.0" r="12.0" class="dg-line-2" /><circle cx="129.0" cy="201.0" r="6.0" class="dg-line-2" /><text x="129.0" y="235.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="129.0" dy="0.0">Epiphany</tspan></text><text x="200.0" y="262.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="-10.2">three AI spheres (~75 mi / 120 km each, hundreds of thin layers) orbiting the</tspan><tspan x="200.0" dy="10.2">planet at 120°; with the planet they form a tetrahedron — a &quot;trinary</tspan><tspan x="200.0" dy="10.2">consciousness&quot;</tspan></text></svg>