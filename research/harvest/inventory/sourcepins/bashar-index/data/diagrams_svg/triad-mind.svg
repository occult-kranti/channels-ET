<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="Triad Mind" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">THE TRIAD MIND</tspan></text><polygon points="200.0,60.0 80.0,230.0 320.0,230.0" class="dg-line-2" /><rect x="140.0" y="40.0" width="120.0" height="40.0" rx="6" class="dg-line dg-fill-2" /><text x="200.0" y="63.9" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:600" ><tspan x="200.0" dy="0.0">Higher mind</tspan></text><rect x="20.0" y="210.0" width="120.0" height="40.0" rx="6" class="dg-line dg-fill" /><text x="80.0" y="233.8" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:600" ><tspan x="80.0" dy="0.0">Heart mind</tspan></text><rect x="260.0" y="210.0" width="120.0" height="40.0" rx="6" class="dg-line dg-fill" /><text x="320.0" y="233.7" class="dg-text" text-anchor="middle" style="font-size:10.5px;font-weight:600" ><tspan x="320.0" dy="0.0">Head / physical mind</tspan></text><line x1="170.0" y1="82.0" x2="100.0" y2="206.0" class="dg-line" marker-end="url(#dg-arrow)"/><text x="110.0" y="140.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="110.0" dy="0.0">frequency / vibration</tspan></text><line x1="120.0" y1="206.0" x2="190.0" y2="82.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><text x="175.0" y="160.0" class="dg-muted" text-anchor="start" style="font-size:8.5px" ><tspan x="175.0" dy="0.0">pure resonance</tspan></text><line x1="142.0" y1="232.0" x2="258.0" y2="232.0" class="dg-line" marker-end="url(#dg-arrow)"/><text x="200.0" y="262.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="0.0">filtered through beliefs</tspan></text><text x="200.0" y="282.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">The three minds and the flow are Bashar&#x27;s words (2017); the triangular layout is</tspan><tspan x="200.0" dy="11.4">inferred from &quot;triad&quot;.</tspan></text></svg>