<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Core belief root" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">CHANGING CORE BELIEFS (concept)</tspan></text><rect x="120.0" y="200.0" width="160.0" height="40.0" rx="8" class="dg-line dg-fill-2" /><text x="200.0" y="218.0" class="dg-text" text-anchor="middle" style="font-size:10px;font-weight:700" ><tspan x="200.0" dy="0.0">core belief</tspan></text><text x="200.0" y="232.0" class="dg-text" text-anchor="middle" style="font-size:8px" ><tspan x="200.0" dy="0.0">&quot;I am not enough / not worthy / not safe&quot;</tspan></text><path d="M200,200 Q40,170 40,120" class="dg-line-2" /><rect x="4.0" y="84.0" width="72.0" height="36.0" rx="6" class="dg-line dg-fill" /><text x="40.0" y="105.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="40.0" dy="-5.1">I must work</tspan><tspan x="40.0" dy="10.2">harder</tspan></text><path d="M200,200 Q120,170 120,120" class="dg-line-2" /><rect x="84.0" y="84.0" width="72.0" height="36.0" rx="6" class="dg-line dg-fill" /><text x="120.0" y="105.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="120.0" dy="0.0">people leave</tspan></text><path d="M200,200 Q200,170 200,120" class="dg-line-2" /><rect x="164.0" y="84.0" width="72.0" height="36.0" rx="6" class="dg-line dg-fill" /><text x="200.0" y="105.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="0.0">money is scarce</tspan></text><path d="M200,200 Q280,170 280,120" class="dg-line-2" /><rect x="244.0" y="84.0" width="72.0" height="36.0" rx="6" class="dg-line dg-fill" /><text x="280.0" y="105.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="280.0" dy="0.0">I&#x27;ll be judged</tspan></text><path d="M200,200 Q360,170 360,120" class="dg-line-2" /><rect x="324.0" y="84.0" width="72.0" height="36.0" rx="6" class="dg-line dg-fill" /><text x="360.0" y="105.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="360.0" dy="-5.1">it never works</tspan><tspan x="360.0" dy="10.2">out</tspan></text><text x="200.0" y="60.0" class="dg-muted" text-anchor="middle" style="font-size:9px" ><tspan x="200.0" dy="0.0">surface beliefs (many)</tspan></text><text x="200.0" y="48.0" class="dg-text" text-anchor="middle" style="font-size:9px" ><tspan x="200.0" dy="0.0">trace the emotional trigger downward to the root definition</tspan></text><text x="60.0" y="262.0" class="dg-muted" text-anchor="start" style="font-size:8.5px;font-style:italic" ><tspan x="60.0" dy="0.0">ask: &quot;what would I have to believe is true to feel this way?&quot;</tspan></text></svg>