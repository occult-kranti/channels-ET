<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" role="img" aria-label="Seven steps staircase" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:11.5px;font-weight:700" ><tspan x="200.0" dy="0.0">THE SEVEN SEQUENTIAL STEPS OF MANIFESTATION</tspan></text><rect x="10.0" y="240.0" width="380.0" height="28.0" rx="4" class="dg-line dg-fill" /><text x="20.0" y="258.0" class="dg-text" text-anchor="start" style="font-size:10.5px;font-weight:600" ><tspan x="20.0" dy="0.0">1  Vision</tspan></text><text x="382.0" y="258.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="382.0" dy="0.0">visualise what you want</tspan></text><rect x="36.0" y="210.0" width="354.0" height="28.0" rx="4" class="dg-line dg-fill-2" /><text x="46.0" y="228.0" class="dg-text" text-anchor="start" style="font-size:10.5px;font-weight:600" ><tspan x="46.0" dy="0.0">2  Desire</tspan></text><text x="382.0" y="228.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="382.0" dy="0.0">be intensely excited</tspan></text><rect x="62.0" y="180.0" width="328.0" height="28.0" rx="4" class="dg-line dg-fill" /><text x="72.0" y="198.0" class="dg-text" text-anchor="start" style="font-size:10.5px;font-weight:600" ><tspan x="72.0" dy="0.0">3  Belief</tspan></text><text x="382.0" y="198.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="382.0" dy="0.0">believe it is possible</tspan></text><rect x="88.0" y="150.0" width="302.0" height="28.0" rx="4" class="dg-line dg-fill-2" /><text x="98.0" y="168.0" class="dg-text" text-anchor="start" style="font-size:10.5px;font-weight:600" ><tspan x="98.0" dy="0.0">4  Acceptance</tspan></text><text x="382.0" y="168.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="382.0" dy="0.0">accept it as true</tspan></text><rect x="114.0" y="120.0" width="276.0" height="28.0" rx="4" class="dg-line dg-fill" /><text x="124.0" y="138.0" class="dg-text" text-anchor="start" style="font-size:10.5px;font-weight:600" ><tspan x="124.0" dy="0.0">5  Intent</tspan></text><text x="382.0" y="138.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="382.0" dy="0.0">intend, not merely want</tspan></text><rect x="140.0" y="90.0" width="250.0" height="28.0" rx="4" class="dg-line dg-fill-2" /><text x="150.0" y="108.0" class="dg-text" text-anchor="start" style="font-size:10.5px;font-weight:600" ><tspan x="150.0" dy="0.0">6  Action</tspan></text><text x="382.0" y="108.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="382.0" dy="0.0">act as if it has manifested</tspan></text><rect x="166.0" y="60.0" width="224.0" height="28.0" rx="4" class="dg-line dg-fill" /><text x="176.0" y="78.0" class="dg-text" text-anchor="start" style="font-size:10.5px;font-weight:600" ><tspan x="176.0" dy="0.0">7  Allowance</tspan></text><text x="382.0" y="78.0" class="dg-muted" text-anchor="end" style="font-size:8.5px" ><tspan x="382.0" dy="0.0">detach from the outcome</tspan></text><text x="200.0" y="290.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">Read bottom to top. Wording per bashar.org/sevensteps (taught in a 1995</tspan><tspan x="200.0" dy="11.4">session).</tspan></text></svg>