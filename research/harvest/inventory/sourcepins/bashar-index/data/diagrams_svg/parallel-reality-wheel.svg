<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Parallel Reality Wheel" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">THE PARALLEL REALITY WHEEL</tspan></text><circle cx="200.0" cy="158.0" r="74.0" class="dg-line dg-fill" /><circle cx="200.0" cy="158.0" r="6.0" class="dg-ink-fill" /><text x="200.0" y="167.0" class="dg-text" text-anchor="middle" style="font-size:28px;font-weight:700" ><tspan x="200.0" dy="0.0">?</tspan></text><line x1="200.0" y1="158.0" x2="228.3" y2="89.6" class="dg-line-2" /><circle cx="228.3" cy="89.6" r="9.0" class="dg-ink-fill" /><text x="228.3" y="93.1" class="dg-inv" text-anchor="middle" style="font-size:9px;font-weight:700" ><tspan x="228.3" dy="0.0">1</tspan></text><text x="242.3" y="78.6" class="dg-text" text-anchor="start" style="font-size:7.5px" ><tspan x="242.3" dy="-12.8">Albrecht</tspan><tspan x="242.3" dy="8.5">Eisenstein</tspan><tspan x="242.3" dy="8.5">proposes</tspan><tspan x="242.3" dy="8.5">relativity</tspan></text><line x1="200.0" y1="158.0" x2="268.4" y2="129.7" class="dg-line-2" /><circle cx="268.4" cy="129.7" r="9.0" class="dg-ink-fill" /><text x="268.4" y="133.2" class="dg-inv" text-anchor="middle" style="font-size:9px;font-weight:700" ><tspan x="268.4" dy="0.0">2</tspan></text><text x="282.4" y="118.7" class="dg-text" text-anchor="start" style="font-size:7.5px" ><tspan x="282.4" dy="-8.5">JFK served two</tspan><tspan x="282.4" dy="8.5">terms, lived to</tspan><tspan x="282.4" dy="8.5">1985</tspan></text><line x1="200.0" y1="158.0" x2="268.4" y2="186.3" class="dg-line-2" /><circle cx="268.4" cy="186.3" r="9.0" class="dg-ink-fill" /><text x="268.4" y="189.8" class="dg-inv" text-anchor="middle" style="font-size:9px;font-weight:700" ><tspan x="268.4" dy="0.0">3</tspan></text><text x="282.4" y="209.3" class="dg-text" text-anchor="start" style="font-size:7.5px" ><tspan x="282.4" dy="-8.5">Indian Federation</tspan><tspan x="282.4" dy="8.5">keeps control of</tspan><tspan x="282.4" dy="8.5">the Americas</tspan></text><line x1="200.0" y1="158.0" x2="228.3" y2="226.4" class="dg-line-2" /><circle cx="228.3" cy="226.4" r="9.0" class="dg-ink-fill" /><text x="228.3" y="229.9" class="dg-inv" text-anchor="middle" style="font-size:9px;font-weight:700" ><tspan x="228.3" dy="0.0">4</tspan></text><text x="242.3" y="249.4" class="dg-text" text-anchor="start" style="font-size:7.5px" ><tspan x="242.3" dy="-8.5">The Roman Empire</tspan><tspan x="242.3" dy="8.5">continued to the</tspan><tspan x="242.3" dy="8.5">present</tspan></text><line x1="200.0" y1="158.0" x2="171.7" y2="226.4" class="dg-line-2" /><circle cx="171.7" cy="226.4" r="9.0" class="dg-ink-fill" /><text x="171.7" y="229.9" class="dg-inv" text-anchor="middle" style="font-size:9px;font-weight:700" ><tspan x="171.7" dy="0.0">5</tspan></text><text x="157.7" y="249.4" class="dg-text" text-anchor="end" style="font-size:7.5px" ><tspan x="157.7" dy="-8.5">The USA elects</tspan><tspan x="157.7" dy="8.5">first female</tspan><tspan x="157.7" dy="8.5">president in 2012</tspan></text><line x1="200.0" y1="158.0" x2="131.6" y2="186.3" class="dg-line-2" /><circle cx="131.6" cy="186.3" r="9.0" class="dg-ink-fill" /><text x="131.6" y="189.8" class="dg-inv" text-anchor="middle" style="font-size:9px;font-weight:700" ><tspan x="131.6" dy="0.0">6</tspan></text><text x="117.6" y="209.3" class="dg-text" text-anchor="end" style="font-size:7.5px" ><tspan x="117.6" dy="-4.2">Botticelli paints</tspan><tspan x="117.6" dy="8.5">the Sistine Chapel</tspan></text><line x1="200.0" y1="158.0" x2="131.6" y2="129.7" class="dg-line-2" /><circle cx="131.6" cy="129.7" r="9.0" class="dg-ink-fill" /><text x="131.6" y="133.2" class="dg-inv" text-anchor="middle" style="font-size:9px;font-weight:700" ><tspan x="131.6" dy="0.0">7</tspan></text><text x="117.6" y="118.7" class="dg-text" text-anchor="end" style="font-size:7.5px" ><tspan x="117.6" dy="-8.5">The USA is the</tspan><tspan x="117.6" dy="8.5">United States of</tspan><tspan x="117.6" dy="8.5">Atlantis</tspan></text><line x1="200.0" y1="158.0" x2="171.7" y2="89.6" class="dg-line-2" /><circle cx="171.7" cy="89.6" r="9.0" class="dg-ink-fill" /><text x="171.7" y="93.1" class="dg-inv" text-anchor="middle" style="font-size:9px;font-weight:700" ><tspan x="171.7" dy="0.0">8</tspan></text><text x="157.7" y="78.6" class="dg-text" text-anchor="end" style="font-size:7.5px" ><tspan x="157.7" dy="-8.5">Peace is brokered</tspan><tspan x="157.7" dy="8.5">in the Middle East</tspan><tspan x="157.7" dy="8.5">in 1967</tspan></text><text x="200.0" y="292.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">Eight captions verbatim from the 2020 handout; their angular placement on the</tspan><tspan x="200.0" dy="11.4">original is approximate.</tspan></text></svg>