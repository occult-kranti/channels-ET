<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 236" role="img" aria-label="Hybrid races ladder" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:700" ><tspan x="200.0" dy="0.0">THE HYBRID RACES — as described in the 2014–2018 sessions</tspan></text><rect x="150.0" y="28.0" width="100.0" height="38.0" rx="4" class="dg-black" /><rect x="158.0" y="34.0" width="84.0" height="8.0" rx="0" class="dg-black" /><rect x="158.0" y="43.0" width="84.0" height="8.0" rx="0" class="dg-grey" /><rect x="158.0" y="52.0" width="84.0" height="8.0" rx="0" class="dg-white" /><text x="200.0" y="78.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="0.0">Grey Federation (source of the programme)</tspan></text><text x="60.0" y="78.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px" ><tspan x="60.0" dy="0.0">Earth humans →</tspan></text><path d="M90,84 Q120,120 330,164" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="12.0" y="96.0" width="48.0" height="48.0" rx="3" class="dg-black" /><polygon points="36.0,103.0 52.2,114.7 46.0,133.8 26.0,133.8 19.8,114.7" class="dg-white" /><circle cx="36.0" cy="122.0" r="4.0" class="dg-black" /><text x="36.0" y="156.0" class="dg-text" text-anchor="middle" style="font-size:7.5px" ><tspan x="36.0" dy="0.0">1st</tspan></text><line x1="61.0" y1="120.0" x2="66.0" y2="120.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="67.0" y="96.0" width="48.0" height="48.0" rx="3" class="dg-black" /><polygon points="91.0,103.0 107.2,114.7 101.0,133.8 81.0,133.8 74.8,114.7" class="dg-white" /><circle cx="91.0" cy="122.0" r="4.0" class="dg-violet" /><text x="91.0" y="156.0" class="dg-text" text-anchor="middle" style="font-size:7.5px" ><tspan x="91.0" dy="0.0">2nd</tspan></text><line x1="116.0" y1="120.0" x2="121.0" y2="120.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="122.0" y="96.0" width="48.0" height="48.0" rx="3" class="dg-black" /><polygon points="146.0,106.0 160.7,131.5 131.3,131.5" class="dg-white" /><text x="162.0" y="108.0" class="dg-white-text" text-anchor="middle" style="font-size:9px" ><tspan x="162.0" dy="0.0">?</tspan></text><text x="146.0" y="156.0" class="dg-text" text-anchor="middle" style="font-size:7.5px" ><tspan x="146.0" dy="0.0">3rd Essassani</tspan></text><line x1="171.0" y1="120.0" x2="176.0" y2="120.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="177.0" y="96.0" width="48.0" height="48.0" rx="3" class="dg-black" /><polygon points="201.0,103.0 217.2,114.7 211.0,133.8 191.0,133.8 184.8,114.7" class="dg-white" /><circle cx="201.0" cy="122.0" r="4.0" class="dg-gold" /><text x="201.0" y="156.0" class="dg-text" text-anchor="middle" style="font-size:7.5px" ><tspan x="201.0" dy="0.0">4th</tspan></text><line x1="226.0" y1="120.0" x2="231.0" y2="120.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="232.0" y="96.0" width="48.0" height="48.0" rx="3" class="dg-black" /><polygon points="256.0,103.0 272.2,114.7 266.0,133.8 246.0,133.8 239.8,114.7" class="dg-white" /><circle cx="256.0" cy="122.0" r="4.0" class="dg-green" /><text x="256.0" y="156.0" class="dg-text" text-anchor="middle" style="font-size:7.5px" ><tspan x="256.0" dy="0.0">5th Yahyel</tspan></text><line x1="281.0" y1="120.0" x2="286.0" y2="120.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="287.0" y="96.0" width="48.0" height="48.0" rx="3" class="dg-black" /><polygon points="311.0,103.0 325.7,111.5 325.7,128.5 311.0,137.0 296.3,128.5 296.3,111.5" class="dg-white" /><circle cx="311.0" cy="120.0" r="4.0" class="dg-violet" /><text x="311.0" y="156.0" class="dg-text" text-anchor="middle" style="font-size:7.5px" ><tspan x="311.0" dy="0.0">6th Earth</tspan></text><line x1="336.0" y1="120.0" x2="341.0" y2="120.0" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><rect x="342.0" y="96.0" width="48.0" height="48.0" rx="3" class="dg-black" /><polygon points="366.0,103.0 380.7,111.5 380.7,128.5 