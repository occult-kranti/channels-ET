<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="7-Part Master Permission Slip table" class="dg"><text x="200.0" y="18.0" class="dg-text" text-anchor="middle" style="font-size:12px;font-weight:700" ><tspan x="200.0" dy="0.0">THE 7-PART MASTER PERMISSION SLIP</tspan></text><text x="38.0" y="28.0" class="dg-muted" text-anchor="middle" style="font-size:9px" ><tspan x="38.0" dy="0.0">Day · element</tspan></text><text x="128.0" y="28.0" class="dg-muted" text-anchor="middle" style="font-size:9px" ><tspan x="128.0" dy="0.0">action before each line</tspan></text><text x="285.0" y="28.0" class="dg-muted" text-anchor="middle" style="font-size:9px" ><tspan x="285.0" dy="0.0">three statements</tspan></text><rect x="8.0" y="34.0" width="384.0" height="30.0" rx="4" class="dg-line-2 dg-fill" /><text x="38.0" y="54.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:600" ><tspan x="38.0" dy="0.0">Mon · Air</tspan></text><text x="128.0" y="54.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="128.0" dy="0.0">one deep breath</tspan></text><text x="285.0" y="54.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="285.0" dy="0.0">I am a child of creation · unique · worthy</tspan></text><rect x="8.0" y="68.0" width="384.0" height="30.0" rx="4" class="dg-line-2 " /><text x="38.0" y="88.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:600" ><tspan x="38.0" dy="0.0">Tue · Water</tspan></text><text x="128.0" y="88.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="128.0" dy="0.0">one sip of water</tspan></text><text x="285.0" y="88.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="285.0" dy="0.0">I am happy · grateful · refreshed</tspan></text><rect x="8.0" y="102.0" width="384.0" height="30.0" rx="4" class="dg-line-2 dg-fill" /><text x="38.0" y="122.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:600" ><tspan x="38.0" dy="0.0">Wed · Food</tspan></text><text x="128.0" y="122.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="128.0" dy="0.0">one small bite</tspan></text><text x="285.0" y="122.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="285.0" dy="0.0">I am abundant · nurtured · fulfilled</tspan></text><rect x="8.0" y="136.0" width="384.0" height="30.0" rx="4" class="dg-line-2 " /><text x="38.0" y="156.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:600" ><tspan x="38.0" dy="0.0">Thu · Love</tspan></text><text x="128.0" y="156.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="128.0" dy="0.0">a hug (mirror)</tspan></text><text x="285.0" y="156.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="285.0" dy="0.0">I am supported · guided · loved</tspan></text><rect x="8.0" y="170.0" width="384.0" height="30.0" rx="4" class="dg-line-2 dg-fill" /><text x="38.0" y="190.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:600" ><tspan x="38.0" dy="0.0">Fri · Freedom</tspan></text><text x="128.0" y="190.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="128.0" dy="0.0">a spin, arms out</tspan></text><text x="285.0" y="190.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="285.0" dy="0.0">I am awake · powerful · free</tspan></text><rect x="8.0" y="204.0" width="384.0" height="30.0" rx="4" class="dg-line-2 " /><text x="38.0" y="224.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:600" ><tspan x="38.0" dy="0.0">Sat · Passion</tspan></text><text x="128.0" y="224.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="128.0" dy="-5.7">favourite word ×3,</tspan><tspan x="128.0" dy="11.4">sound, image</tspan></text><text x="285.0" y="224.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="285.0" dy="0.0">(your favourite word, sound, image)</tspan></text><rect x="8.0" y="238.0" width="384.0" height="30.0" rx="4" class="dg-line-2 dg-fill" /><text x="38.0" y="258.0" class="dg-text" text-anchor="middle" style="font-size:11px;font-weight:600" ><tspan x="38.0" dy="0.0">Sun · Dream</tspan></text><text x="128.0" y="258.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="128.0" dy="0.0">eyes closed, ×3</tspan></text><text x="285.0" y="258.0" class="dg-text" text-anchor="middle" style="font-size:9.5px" ><tspan x="285.0" dy="-5.7">I am rested · connected · my life is a</tspan><tspan x="285.0" dy="11.4">dream come true</tspan></text><text x="200.0" y="292.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="-5.7">7 weeks (49 days), morning and evening. Table order from the session transcript;</tspan><tspan x="200.0" dy="11.4">the handout&#x27;s own layout is not visible.</tspan></text></svg>