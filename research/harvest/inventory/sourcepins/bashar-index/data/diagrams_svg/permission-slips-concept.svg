<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Permission slip loop" class="dg"><text x="200.0" y="16.0" class="dg-text" text-anchor="middle" style="font-size:11.5px;font-weight:700" ><tspan x="200.0" dy="0.0">PERMISSION SLIPS — the tool has no power of its own</tspan></text><rect x="4.0" y="68.0" width="92.0" height="44.0" rx="6" class="dg-line dg-fill" /><text x="50.0" y="93.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="50.0" dy="0.0">You (already able)</tspan></text><rect x="154.0" y="38.0" width="92.0" height="44.0" rx="6" class="dg-line dg-fill" /><text x="200.0" y="63.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="200.0" dy="-10.2">permission slip:</tspan><tspan x="200.0" dy="10.2">object, ritual,</tspan><tspan x="200.0" dy="10.2">teacher…</tspan></text><rect x="304.0" y="68.0" width="92.0" height="44.0" rx="6" class="dg-line dg-fill" /><text x="350.0" y="93.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="350.0" dy="-5.1">belief: &quot;now I&#x27;m</tspan><tspan x="350.0" dy="10.2">allowed&quot;</tspan></text><rect x="254.0" y="178.0" width="92.0" height="44.0" rx="6" class="dg-line dg-fill" /><text x="300.0" y="203.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="300.0" dy="0.0">state shift</tspan></text><rect x="54.0" y="178.0" width="92.0" height="44.0" rx="6" class="dg-line dg-fill" /><text x="100.0" y="203.0" class="dg-text" text-anchor="middle" style="font-size:8.5px" ><tspan x="100.0" dy="0.0">experience</tspan></text><line x1="96.0" y1="82.0" x2="154.0" y2="68.0" class="dg-line" marker-end="url(#dg-arrow)"/><line x1="246.0" y1="68.0" x2="304.0" y2="82.0" class="dg-line" marker-end="url(#dg-arrow)"/><line x1="340.0" y1="112.0" x2="312.0" y2="178.0" class="dg-line" marker-end="url(#dg-arrow)"/><line x1="254.0" y1="200.0" x2="146.0" y2="200.0" class="dg-line" marker-end="url(#dg-arrow)"/><path d="M70,112 Q140,150 254,190" class="dg-line-2" marker-end="url(#dg-arrow-2)"/><text x="150.0" y="140.0" class="dg-muted" text-anchor="middle" style="font-size:8.5px;font-style:italic" ><tspan x="150.0" dy="0.0">the shortcut: you never needed it</tspan></text><text x="200.0" y="242.0" class="dg-muted" text-anchor="middle" style="font-size:9.5px;font-style:italic" ><tspan x="200.0" dy="0.0">&quot;Hold them lightly&quot; — a permission slip works only because you decide it does.</tspan></text></svg>